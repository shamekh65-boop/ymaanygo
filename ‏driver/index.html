<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ymaanyGO Driver</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:system-ui;background:#f3f7f4;color:#0b2e1f;padding-bottom:82px}
.wrap{padding:16px;max-width:720px;margin:auto}
.header{background:linear-gradient(135deg,#2ecc71,#27ae60);color:white;border-radius:24px;padding:18px;box-shadow:0 12px 28px rgba(46,204,113,.25)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:22px}
.status{border:0;border-radius:999px;padding:10px 14px;font-weight:900;background:#fff;color:#27ae60}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;gap:10px}
.stat{background:rgba(255,255,255,.18);border-radius:16px;padding:12px}
.stat b{font-size:22px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:900;background:white;color:#0b2e1f}
.tabs button.active{background:#0b2e1f;color:white}
.card{background:white;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.07)}
.route{font-weight:900;font-size:17px}
.meta{font-size:13px;color:#668373;margin-top:6px;line-height:1.6}
.price{font-size:34px;font-weight:1000;margin-top:12px}
.note{background:#e9f8ef;color:#146c3c;border-radius:14px;padding:10px;margin-top:10px;font-weight:800;font-size:13px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:900;cursor:pointer}
.btn.green{background:#2ecc71;color:white}
.btn.dark{background:#0b2e1f;color:white}
.btn.gray{background:#eef3ef;color:#0b2e1f}
.btn.red{background:#e74c3c;color:white}
.empty{text-align:center;color:#668373;padding:30px 10px}
.hidden{display:none}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:white;border-top:1px solid #e5eee8;display:flex;justify-content:space-around;align-items:center;z-index:30}
.bottom-nav button{border:0;background:transparent;font-weight:900;color:#6b8c79}
.bottom-nav button.active{color:#27ae60}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:50}
.sheet-bg.open{display:flex}
.sheet{background:white;width:100%;border-radius:28px 28px 0 0;padding:18px;max-height:86vh;overflow:auto}
.sheet h2{margin:0 0 12px}
.info{background:#f6fbf8;border:1px solid #e3efe8;border-radius:16px;padding:12px;margin:10px 0}
.info small{display:block;color:#6b8c79;font-weight:800;margin-bottom:4px}
input{width:100%;padding:13px;border-radius:14px;border:1px solid #dbe9e1;margin-top:6px}
</style>
</head>
<body>

<div class="wrap">

<section id="homeTab">
  <div class="header">
    <div class="top">
      <div>
        <h1>ymaanyGO Driver</h1>
        <div id="driverName">Chauffeur</div>
      </div>
      <button class="status" id="onlineBtn" onclick="toggleOnline()">🟢 Online</button>
    </div>
    <div class="stats">
      <div class="stat"><div>Ritten vandaag</div><b id="todayCount">0</b></div>
      <div class="stat"><div>Verdiensten</div><b id="todayMoney">€0</b></div>
    </div>
  </div>

  <div class="tabs">
    <button id="auctionBtn" class="active" onclick="setHomeMode('auction')">Veiling</button>
    <button id="myBtn" onclick="setHomeMode('mine')">Mijn ritten</button>
  </div>

  <div id="ridesList"></div>
</section>

<section id="agendaTab" class="hidden">
  <div class="card">
    <h2>📅 Agenda</h2>
    <p class="meta">Aankomende ritten die door jou zijn geaccepteerd.</p>
  </div>
  <div id="agendaList"></div>
</section>

<section id="accountTab" class="hidden">
  <div class="card">
    <h2>👤 Account</h2>
    <div class="info"><small>Naam</small><div id="accName">-</div></div>
    <div class="info"><small>E-mail</small><div id="accEmail">-</div></div>
    <div class="info"><small>Status</small><div id="accStatus">approved</div></div>
    <button class="btn red" onclick="logout()">Uitloggen</button>
  </div>
</section>

</div>

<nav class="bottom-nav">
  <button id="navHome" class="active" onclick="showTab('home')">🏠<br>Home</button>
  <button id="navAgenda" onclick="showTab('agenda')">📅<br>Agenda</button>
  <button id="navAccount" onclick="showTab('account')">👤<br>Account</button>
</nav>

<div id="rideSheet" class="sheet-bg" onclick="closeSheet()">
  <div class="sheet" onclick="event.stopPropagation()">
    <h2>Rit details</h2>
    <div id="sheetContent"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lxbfobdczjgqnotwsnki.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_H5HKGlHBe9z3ejn0B-NKsw_9Mo-MIhp";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let driverProfile = null;
let rides = [];
let online = true;
let homeMode = "auction";
let selectedRide = null;

function priceNumber(v){
  return Number(String(v || "0").replace("€","").replace(",",".").trim()) || 0;
}

function fmtDate(v){
  if(!v) return "-";
  const d = new Date(v);
  if(isNaN(d)) return "-";
  return d.toLocaleString("nl-NL",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

function showTab(tab){
  homeTab.classList.add("hidden");
  agendaTab.classList.add("hidden");
  accountTab.classList.add("hidden");
  navHome.classList.remove("active");
  navAgenda.classList.remove("active");
  navAccount.classList.remove("active");

  if(tab === "home"){homeTab.classList.remove("hidden");navHome.classList.add("active")}
  if(tab === "agenda"){agendaTab.classList.remove("hidden");navAgenda.classList.add("active");renderAgenda()}
  if(tab === "account"){accountTab.classList.remove("hidden");navAccount.classList.add("active")}
}

function setHomeMode(mode){
  homeMode = mode;
  auctionBtn.classList.toggle("active",mode==="auction");
  myBtn.classList.toggle("active",mode==="mine");
  renderRides();
}

function toggleOnline(){
  online = !online;
  onlineBtn.textContent = online ? "🟢 Online" : "🔴 Offline";
  onlineBtn.style.color = online ? "#27ae60" : "#e74c3c";
  renderRides();
}

async function protectDriver(){
  const { data:sessionData } = await db.auth.getSession();

  if(!sessionData.session){
    location.href = "/driver/login.html";
    return false;
  }

  currentUser = sessionData.session.user;

  const { data:profile } = await db
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  driverProfile = profile || {};
  driverName.textContent = driverProfile.name || currentUser.email || "Chauffeur";
  accName.textContent = driverProfile.name || "-";
  accEmail.textContent = currentUser.email || "-";
  accStatus.textContent = driverProfile.role || "driver";

  return true;
}

async function loadRides(){
  const ok = await protectDriver();
  if(!ok) return;

  const { data,error } = await db
    .from("rides")
    .select("*")
    .or(`status.eq.pending,driver_id.eq.${currentUser.id}`)
    .order("pickup_time",{ascending:true});

  if(error){
    ridesList.innerHTML = `<div class="empty">${error.message}</div>`;
    return;
  }

  rides = data || [];
  renderRides();
  renderStats();
}

function renderStats(){
  const today = new Date().toISOString().slice(0,10);
  const mineToday = rides.filter(r =>
    r.driver_id === currentUser.id &&
    String(r.pickup_time || "").slice(0,10) === today &&
    r.status === "completed"
  );

  todayCount.textContent = mineToday.length;
  todayMoney.textContent = "€" + mineToday.reduce((s,r)=>s + priceNumber(r.price),0).toFixed(2);
}

function rideCard(r){
  const mine = r.driver_id === currentUser.id;
  const price = r.price || "€0";

  return `
    <div class="card">
      <div class="route">${r.from_address || "-"} → ${r.to_address || "-"}</div>
      <div class="meta">
        📅 ${fmtDate(r.pickup_time)}<br>
        🚖 ${r.vehicle || "-"} · 👤 ${r.passengers || 1} passagiers<br>
        💳 ${r.payment_status || "unpaid"} · Status: ${r.status || "pending"}
      </div>
      <div class="price">${price}</div>
      <div class="note">100% van dit bedrag is voor jou<br>Geen commissie op deze rit</div>
      <div class="actions">
        <button class="btn gray" onclick="openRide('${r.id}')">Bekijken</button>
        ${!mine && r.status === "pending" ? `<button class="btn green" onclick="acceptRide('${r.id}')">Accepteren</button>` : ""}
        ${mine ? `<button class="btn dark" onclick="quickStatus('${r.id}','on_the_way')">Onderweg</button>
        <button class="btn dark" onclick="quickStatus('${r.id}','arrived')">Aangekomen</button>
        <button class="btn green" onclick="quickStatus('${r.id}','completed')">Voltooien</button>` : ""}
      </div>
    </div>
  `;
}

function renderRides(){
  if(!online && homeMode === "auction"){
    ridesList.innerHTML = `<div class="empty">Je bent offline. Zet jezelf online om ritten te zien.</div>`;
    return;
  }

  let list = rides.filter(r=>{
    if(homeMode === "auction") return r.status === "pending";
    return r.driver_id === currentUser.id;
  });

  if(!list.length){
    ridesList.innerHTML = `<div class="empty">Geen ritten gevonden.</div>`;
    return;
  }

  ridesList.innerHTML = list.map(rideCard).join("");
}

function renderAgenda(){
  const mine = rides.filter(r =>
    r.driver_id === currentUser.id &&
    r.status !== "completed" &&
    r.status !== "cancelled"
  );

  if(!mine.length){
    agendaList.innerHTML = `<div class="empty">Geen geplande ritten.</div>`;
    return;
  }

  agendaList.innerHTML = mine.map(rideCard).join("");
}

function openRide(id){
  selectedRide = rides.find(r=>r.id===id);
  if(!selectedRide) return;

  sheetContent.innerHTML = `
    <div class="info"><small>Pickup</small>${selectedRide.from_address || "-"}</div>
    <div class="info"><small>Bestemming</small>${selectedRide.to_address || "-"}</div>
    <div class="info"><small>Tijd</small>${fmtDate(selectedRide.pickup_time)}</div>
    <div class="info"><small>Prijs</small><b>${selectedRide.price || "€0"}</b><br>100% voor chauffeur</div>
    <div class="info"><small>Klant</small>${selectedRide.customer_name || "-"}<br>${selectedRide.customer_phone || "-"}</div>

    <div class="actions">
      <a class="btn dark" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedRide.from_address || "")}" target="_blank">Navigeren</a>
      <a class="btn green" href="https://wa.me/${String(selectedRide.customer_phone || "").replace(/\\D/g,"")}" target="_blank">WhatsApp</a>
      ${selectedRide.customer_phone ? `<a class="btn gray" href="tel:${selectedRide.customer_phone}">Bellen</a>` : ""}
    </div>

    <div class="actions">
      ${selectedRide.status === "pending" ? `<button class="btn green" onclick="acceptRide('${selectedRide.id}')">Accepteren</button>` : ""}
      ${selectedRide.driver_id === currentUser.id ? `
      <button class="btn dark" onclick="quickStatus('${selectedRide.id}','on_the_way')">Onderweg</button>
      <button class="btn dark" onclick="quickStatus('${selectedRide.id}','arrived')">Aangekomen</button>
      <button class="btn green" onclick="quickStatus('${selectedRide.id}','completed')">Voltooien</button>` : ""}
    </div>
  `;

  rideSheet.classList.add("open");
}

function closeSheet(){
  rideSheet.classList.remove("open");
}

async function acceptRide(id){
  const payload = {
    driver_id: currentUser.id,
    driver_name: driverProfile.name || currentUser.email,
    driver_phone: driverProfile.phone || "",
    status: "accepted",
    accepted_at: new Date().toISOString()
  };

  const { error } = await db.from("rides").update(payload).eq("id",id);

  if(error){alert(error.message);return}

  closeSheet();
  await loadRides();
  setHomeMode("mine");
}

async function quickStatus(id,status){
  const payload = { status };

  if(status === "completed") payload.completed_at = new Date().toISOString();

  const { error } = await db.from("rides").update(payload).eq("id",id);

  if(error){alert(error.message);return}

  closeSheet();
  await loadRides();
}

async function logout(){
  await db.auth.signOut();
  location.href = "/driver/login.html";
}

loadRides();
setInterval(loadRides,10000);
</script>
</body>
</html>
