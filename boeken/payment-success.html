<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betaling ontvangen – ymaanyGO</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2ecc71">
<link rel="icon" href="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico">

<style>
:root{
  --green:#2ecc71;
  --green2:#27ae60;
  --dark:#0b2e1f;
  --muted:#5d7f6c;
  --line:rgba(0,0,0,.08);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(46,204,113,.28),transparent 34%),
    radial-gradient(circle at top right,rgba(39,174,96,.22),transparent 30%),
    linear-gradient(180deg,#f6fbf8,#e6f3ed,#d7ece2);
  color:var(--dark);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  overflow:hidden;
}

.fireworks{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.burst{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  animation:boom 1.8s infinite ease-out;
}

.burst:nth-child(1){top:16%;left:18%;background:#2ecc71;animation-delay:.1s}
.burst:nth-child(2){top:12%;right:18%;background:#f1c40f;animation-delay:.45s}
.burst:nth-child(3){top:28%;left:78%;background:#27ae60;animation-delay:.85s}
.burst:nth-child(4){top:22%;left:48%;background:#3498db;animation-delay:1.15s}

@keyframes boom{
  0%{box-shadow:0 0 0 0 currentColor;transform:scale(.5);opacity:1}
  60%{
    box-shadow:
      0 -42px 0 0 currentColor,
      34px -24px 0 0 currentColor,
      42px 0 0 0 currentColor,
      30px 30px 0 0 currentColor,
      0 42px 0 0 currentColor,
      -30px 30px 0 0 currentColor,
      -42px 0 0 0 currentColor,
      -34px -24px 0 0 currentColor;
    opacity:.85;
  }
  100%{opacity:0;transform:scale(1.4)}
}

.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:500px;
  background:rgba(255,255,255,.95);
  border:1px solid var(--line);
  border-radius:32px;
  padding:36px 24px;
  text-align:center;
  box-shadow:0 28px 60px rgba(11,46,31,.18);
}

.logo{
  width:76px;
  height:76px;
  border-radius:20px;
  background:#fff;
  padding:8px;
  border:1px solid var(--line);
  margin-bottom:18px;
}

.check{
  width:90px;
  height:90px;
  margin:0 auto 20px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--green2));
  display:grid;
  place-items:center;
  color:white;
  font-size:46px;
  font-weight:900;
  box-shadow:0 18px 34px rgba(46,204,113,.38);
  animation:pop .7s ease;
}

@keyframes pop{
  0%{transform:scale(.35);opacity:0}
  70%{transform:scale(1.12)}
  100%{transform:scale(1);opacity:1}
}

h1{
  font-size:32px;
  line-height:1.15;
  margin-bottom:10px;
}

p{
  color:var(--muted);
  font-size:16px;
  line-height:1.6;
}

.notice{
  margin-top:18px;
  padding:15px;
  border-radius:18px;
  background:rgba(46,204,113,.10);
  border:1px solid rgba(46,204,113,.22);
  color:#146c3c;
  font-size:14px;
  font-weight:700;
}

.steps{
  margin-top:18px;
  display:grid;
  gap:10px;
  text-align:left;
}

.step{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px 14px;
  font-size:14px;
  color:#335b45;
  display:flex;
  gap:10px;
  align-items:center;
}

.step span{
  width:26px;
  height:26px;
  border-radius:50%;
  background:rgba(46,204,113,.14);
  color:#27ae60;
  display:grid;
  place-items:center;
  font-weight:900;
}

.actions{
  margin-top:24px;
  display:grid;
  gap:12px;
}

.btn{
  display:block;
  text-decoration:none;
  border-radius:18px;
  padding:15px 18px;
  font-weight:900;
  font-size:15px;
}

.btn.primary{
  color:#fff;
  background:linear-gradient(90deg,var(--green),var(--green2));
  box-shadow:0 16px 24px -14px rgba(46,204,113,.7);
}

.btn.secondary{
  color:var(--dark);
  background:#fff;
  border:1px solid var(--line);
}

.small{
  margin-top:20px;
  font-size:12px;
  color:#7c9989;
}
</style>
</head>

<body>

<div class="fireworks">
  <i class="burst"></i>
  <i class="burst"></i>
  <i class="burst"></i>
  <i class="burst"></i>
</div>

<main class="card">
  <img class="logo" src="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico" alt="ymaanyGO">

  <div class="check">✓</div>

  <h1>Betaling ontvangen</h1>

  <p>
    Bedankt. Uw betaling is succesvol verwerkt.
    Uw taxirit aanvraag is ontvangen door ymaanyGO.
  </p>

  <div class="notice">
    Uw rit staat nu in behandeling.
  </div>

  <div class="steps">
    <div class="step"><span>1</span> Betaling is ontvangen</div>
    <div class="step"><span>2</span> Wij controleren uw ritgegevens</div>
    <div class="step"><span>3</span> U ontvangt zo snel mogelijk bevestiging</div>
  </div>

  <div class="actions">
    <a class="btn primary" href="/boeken/">Bekijk mijn ritten</a>
    <a class="btn secondary" href="/">Naar homepage</a>
  </div>

  <div class="small">
    © 2026 ymaanyGO
  </div>
</main>

</body>
</html>
