<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ymaanyGO Driver - Werkend</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #f0f4f0;
      padding: 16px;
      padding-bottom: 80px;
    }
    .header {
      background: #1b5e20;
      color: white;
      padding: 16px;
      border-radius: 24px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .online-badge {
      background: white;
      color: #1b5e20;
      padding: 6px 12px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #dce8dc;
    }
    .ride-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .price {
      font-size: 22px;
      font-weight: 800;
      color: #1b5e20;
    }
    .btn {
      background: #1b5e20;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-outline {
      background: white;
      border: 1px solid #1b5e20;
      color: #1b5e20;
    }
    .empty {
      text-align: center;
      color: #6c8e6c;
      padding: 40px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #1e2a1e;
      color: white;
      padding: 12px;
      border-radius: 60px;
      text-align: center;
      z-index: 1000;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="header">
  <div><strong>ymaanyGO</strong><br><span id="driverName">Chauffeur</span></div>
  <div class="online-badge" id="onlineToggle">✅ Online</div>
</div>

<div id="ridesContainer" class="rides-list">
  <div class="empty">🔁 Laden van ritten...</div>
</div>

<div class="toast" id="toastMessage"></div>

<script>
  // ==================== SUPABASE CONFIG ====================
  const SUPABASE_URL = "https://lxbfobdczjgqnotwsnki.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_H5HKGlHBe9z3ejn0B-NKsw_9Mo-MIhp";
  const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let driverId = null;
  let rides = [];
  let online = true;
  let knownRideIds = new Set();

  // DOM elements
  const ridesContainer = document.getElementById("ridesContainer");
  const toastMsg = document.getElementById("toastMessage");
  const driverNameSpan = document.getElementById("driverName");
  const onlineToggle = document.getElementById("onlineToggle");

  // Helper: toast
  function showToast(message, duration = 3000) {
    toastMsg.textContent = message;
    toastMsg.classList.add("show");
    setTimeout(() => toastMsg.classList.remove("show"), duration);
  }

  // Helper: geluid
  function playSound() {
    try {
      const audio = new Audio("https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3");
      audio.volume = 0.5;
      audio.play().catch(e => console.log("sound blocked", e));
    } catch(e) {}
  }

  // Helper: notificatie (visueel + geluid)
  function sendNotification(ride) {
    if (!ride || ride.status !== "pending") return;
    playSound();
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("🚖 Nieuwe rit beschikbaar!", {
        body: `${ride.from_address?.split(",")[0]} → ${ride.to_address?.split(",")[0]} · €${ride.price} · ${new Date(ride.pickup_time).toLocaleTimeString("nl-NL", {hour:"2-digit", minute:"2-digit"})}`,
        icon: "https://ymaanygo.nl/favicon.ico",
        tag: ride.id
      });
    } else {
      showToast("🔔 Nieuwe rit! Klik om te accepteren.", 5000);
    }
  }

  // ==================== AUTHENTICATIE ====================
  async function initAuth() {
    // Voor demonstratie: we gebruiken een vaste testdriver als er geen sessie is
    // Maar we proberen eerst bestaande sessie
    const { data: { session } } = await supabase.auth.getSession();
    if (session && session.user) {
      currentUser = session.user;
      driverId = currentUser.id;
      const { data: profile } = await supabase.from("profiles").select("name").eq("id", driverId).maybeSingle();
      driverNameSpan.innerText = profile?.name || currentUser.email?.split("@")[0] || "Chauffeur";
      return true;
    } else {
      // Fallback: anonieme driver voor test (zonder login) - werkt alleen als RLS anon toestaat
      // We genereren een vaste ID voor demo doeleinden
      driverId = "test-driver-123";
      driverNameSpan.innerText = "Demo Chauffeur";
      console.warn("Geen ingelogde gebruiker, gebruik demo modus");
      return true;
    }
  }

  // ==================== RIDES LADEN & REALTIME ====================
  async function loadRides() {
    if (!driverId) return;
    // Haal alle ritten op die 'pending' zijn OF toegewezen aan deze driver
    let query = supabase
      .from("rides")
      .select("*")
      .or(`status.eq.pending,driver_id.eq.${driverId}`)
      .order("pickup_time", { ascending: true });
    
    const { data, error } = await query;
    if (error) {
      console.error("Fout bij laden:", error);
      ridesContainer.innerHTML = `<div class="empty">⚠️ Fout: ${error.message}</div>`;
      return;
    }
    if (data) {
      const oldRides = rides;
      rides = data;
      renderRides();
      // Detecteer nieuwe pending ritten
      const newPending = rides.filter(r => r.status === "pending" && !knownRideIds.has(r.id));
      for (const ride of newPending) {
        knownRideIds.add(ride.id);
        sendNotification(ride);
      }
    }
  }

  function renderRides() {
    if (!online) {
      ridesContainer.innerHTML = `<div class="empty">📡 Je bent offline. Zet online om ritten te zien.</div>`;
      return;
    }
    const pendingRides = rides.filter(r => r.status === "pending");
    if (pendingRides.length === 0) {
      ridesContainer.innerHTML = `<div class="empty">✨ Geen beschikbare ritten op dit moment.</div>`;
      return;
    }
    ridesContainer.innerHTML = pendingRides.map(ride => `
      <div class="card" data-ride-id="${ride.id}">
        <div class="ride-header">
          <span>📅 ${new Date(ride.pickup_time).toLocaleString("nl-NL", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"})}</span>
          <span class="price">€${parseFloat(ride.price || 0).toFixed(2)}</span>
        </div>
        <div><strong>📍 ${ride.from_address?.split(",")[0] || "Onbekend"}</strong><br><span style="font-size:12px;">${ride.from_address || ""}</span></div>
        <div style="margin-top: 8px;"><strong>🏁 ${ride.to_address?.split(",")[0] || "Bestemming"}</strong><br><span style="font-size:12px;">${ride.to_address || ""}</span></div>
        <div style="display: flex; gap: 10px; margin-top: 16px;">
          <button class="btn" onclick="acceptRide('${ride.id}')">✅ Accepteren</button>
          <button class="btn btn-outline" onclick="navigateTo('${ride.from_address}')">🗺️ Navigeer</button>
        </div>
      </div>
    `).join("");
  }

  // ==================== ACCEPT RIDE (met race condition check) ====================
  window.acceptRide = async function(rideId) {
    if (!driverId) {
      showToast("❌ Niet ingelogd", 2000);
      return;
    }
    // Update alleen als status nog 'pending' is
    const { data, error } = await supabase
      .from("rides")
      .update({
        driver_id: driverId,
        driver_name: driverNameSpan.innerText,
        status: "accepted",
        accepted_at: new Date().toISOString()
      })
      .eq("id", rideId)
      .eq("status", "pending")  // cruciale regel tegen race condition
      .select();

    if (error) {
      showToast("❌ Fout: " + error.message, 3000);
      return;
    }
    if (!data || data.length === 0) {
      showToast("⚠️ Deze rit is al geaccepteerd door een andere chauffeur!", 4000);
      return;
    }
    showToast("✅ Rit geaccepteerd! Bedankt.", 3000);
    loadRides(); // herlaad
  };

  window.navigateTo = function(addr) {
    if (addr) window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`);
  };

  // ==================== ONLINE TOGGLE ====================
  onlineToggle.addEventListener("click", () => {
    online = !online;
    onlineToggle.innerText = online ? "✅ Online" : "❌ Offline";
    renderRides();
  });

  // ==================== REALTIME SUBSCRIPTION ====================
  function setupRealtime() {
    const channel = supabase
      .channel("rides-public")
      .on("postgres_changes", { event: "*", schema: "public", table: "rides" }, (payload) => {
        console.log("Realtime update", payload);
        loadRides(); // Direct opnieuw laden bij elke wijziging
      })
      .subscribe((status) => {
        console.log("Realtime status:", status);
        if (status === "SUBSCRIBED") showToast("🔌 Live verbinding actief", 2000);
      });
  }

  // ==================== INIT & NOTIFICATION PERMISSIONS ====================
  async function init() {
    await initAuth();
    await loadRides();
    setupRealtime();
    // Vraag toestemming voor notificaties bij eerste klik op de pagina
    const requestNotificationPerm = () => {
      if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission().then(perm => console.log("Notificatie toestemming:", perm));
      }
      document.removeEventListener("click", requestNotificationPerm);
    };
    document.addEventListener("click", requestNotificationPerm);
    // Automatisch geluid/test bij laden
    setTimeout(() => {
      if (rides.filter(r => r.status === "pending").length > 0) {
        playSound();
      }
    }, 1000);
  }

  init();
</script>
</body>
</html>
