<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ymaanyGO Driver - iOS</title>
  <link rel="manifest" href="manifest.json"> <!-- مهم لـ PWA -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui; background: #f0f4f0; padding: 16px; margin: 0; }
    .card { background: white; border-radius: 20px; padding: 16px; margin-bottom: 12px; }
    button { background: #1b5e20; color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; margin: 5px; }
    .toast { position: fixed; bottom: 20px; left: 20px; right: 20px; background: black; color: white; padding: 12px; border-radius: 30px; text-align: center; opacity: 0; transition: 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>🚖 ymaanyGO Driver</h1>
  <div id="status">Online ✅</div>
  <div id="rides"></div>
  <button id="enableSoundBtn">🔊 Activeer geluid & notificaties</button>
  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = "https://lxbfobdczjgqnotwsnki.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_H5HKGlHBe9z3ejn0B-NKsw_9Mo-MIhp";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let rides = [];
    let audioAllowed = false;
    let seenRideIds = new Set();

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function playSound() {
      if (!audioAllowed) return;
      const audio = new Audio("https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3");
      audio.volume = 0.7;
      audio.play().catch(e => console.log("sound error", e));
    }

    async function sendNotification(ride) {
      if (!audioAllowed) return;
      playSound();
      if (Notification.permission === "granted") {
        new Notification("🚖 Nieuwe rit!", {
          body: `${ride.from_address} → ${ride.to_address} · €${ride.price}`,
          icon: "https://ymaanygo.nl/favicon.ico"
        });
      } else if (Notification.permission !== "denied") {
        const perm = await Notification.requestPermission();
        if (perm === "granted") sendNotification(ride);
      }
    }

    async function loadRides() {
      const { data, error } = await db
        .from('rides')
        .select('*')
        .or(`status.eq.pending,driver_id.eq.${currentUser?.id || 'none'}`)
        .order('pickup_time', { ascending: true });
      if (error) return console.error(error);
      const oldIds = new Set(rides.map(r => r.id));
      rides = data || [];
      renderRides();

      // Nieuwe pending ritten detecteren
      for (const ride of rides) {
        if (ride.status === 'pending' && !seenRideIds.has(ride.id)) {
          seenRideIds.add(ride.id);
          sendNotification(ride);
        }
      }
    }

    function renderRides() {
      const container = document.getElementById('rides');
      const pending = rides.filter(r => r.status === 'pending');
      if (pending.length === 0) {
        container.innerHTML = '<div class="card">✨ Geen ritten beschikbaar</div>';
        return;
      }
      container.innerHTML = pending.map(ride => `
        <div class="card">
          <strong>📅 ${new Date(ride.pickup_time).toLocaleString()}</strong><br>
          📍 ${ride.from_address}<br>
          🏁 ${ride.to_address}<br>
          💶 €${ride.price}<br>
          <button onclick="acceptRide('${ride.id}')">✅ Accepteren</button>
        </div>
      `).join('');
    }

    window.acceptRide = async function(id) {
      const { data, error } = await db
        .from('rides')
        .update({ driver_id: currentUser.id, status: 'accepted', accepted_at: new Date() })
        .eq('id', id)
        .eq('status', 'pending')
        .select();
      if (error) toast("❌ Fout: " + error.message);
      else if (!data || data.length === 0) toast("⚠️ Rit al geaccepteerd door ander!");
      else { toast("✅ Geaccepteerd!"); loadRides(); }
    };

    async function init() {
      // Anonieme sessie voor test (geen login nodig)
      const { data: { session } } = await db.auth.getSession();
      if (session) currentUser = session.user;
      else {
        // Fallback: maak anonieme gebruiker of gebruik vaste ID
        currentUser = { id: "anon-test", email: "test@example.com" };
      }
      await loadRides();

      // Realtime setup
      db.channel('rides-ios')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'rides' }, (payload) => {
          console.log("Nieuwe rit via Realtime!", payload.new);
          loadRides();
        })
        .subscribe();

      // iOS vereist dat audio gestart wordt via gebruikersinteractie
      document.getElementById('enableSoundBtn').onclick = () => {
        audioAllowed = true;
        playSound(); // testgeluid
        if (Notification.permission !== 'granted') {
          Notification.requestPermission().then(perm => toast(`Notificaties: ${perm}`));
        }
        toast("🔔 Geluid en notificaties geactiveerd!");
      };
    }

    init();
  </script>
</body>
</html>
