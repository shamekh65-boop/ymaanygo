<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chauffeur Login – ymaanyGO</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2ecc71">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-light:#f6fbf8;--bg-mid:#e6f3ed;--bg-dark:#d7ece2;--panel:rgba(255,255,255,.92);--text:#0b2e1f;--muted:#4f7f68;--line:rgba(0,0,0,.08);--accent:#2ecc71;--accent2:#27ae60;--radius:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(to bottom,var(--bg-light) 0%,var(--bg-mid) 60%,var(--bg-dark) 100%);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px;width:100%}
header{background:linear-gradient(to bottom,rgba(245,248,246,.95),rgba(210,232,220,.92));backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);flex:1}
.logo{width:46px;height:46px;border-radius:12px;background:#fff;padding:6px;border:1px solid var(--line);object-fit:contain}
.brand-name strong{font-size:15px}.brand-name span{font-size:12px;color:var(--muted)}
.btn{padding:10px 16px;border-radius:14px;font-weight:700;text-decoration:none;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 10px 22px rgba(46,204,113,.25);white-space:nowrap;display:inline-block}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:34px 0}
.login-container{max-width:390px;width:100%;background:linear-gradient(0deg,rgba(255,255,255,1) 0%,rgba(240,248,244,1) 100%);border-radius:28px;padding:28px;border:1px solid var(--line);box-shadow:0 22px 30px -18px rgba(11,46,31,.35)}
.login-heading{text-align:center;font-weight:900;font-size:28px}
.login-sub{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
.login-form{margin-top:20px}
.login-input{width:100%;background:#fff;border:none;padding:15px 18px;border-radius:16px;margin-top:14px;font-size:14px;color:var(--text);box-shadow:0 10px 12px -8px rgba(46,204,113,.35);border-inline:2px solid transparent}
.login-input:focus{outline:none;border-inline:2px solid var(--accent)}
.pw-row{position:relative}
.toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;font-weight:800}
.login-button{width:100%;border:none;cursor:pointer;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:15px;border-radius:18px;font-size:16px;font-weight:800;margin-top:18px;box-shadow:0 16px 22px -14px rgba(46,204,113,.6);display:flex;align-items:center;justify-content:center;gap:10px}
.login-button:disabled{opacity:.7}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:none;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{display:none;margin-top:14px;padding:12px 14px;border-radius:14px;font-size:14px}
.msg.err{background:rgba(231,76,60,.08);color:#b42318}
.msg.ok{background:rgba(46,204,113,.08);color:#146c3c}
.hint{text-align:center;margin-top:14px;font-size:12px;color:var(--muted)}
.hint a{color:var(--accent2);text-decoration:none;font-weight:700}
footer{text-align:center;padding:18px 0;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="header-inner">
      <a class="brand" href="/">
        <img class="logo" src="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico" alt="ymaanyGO">
        <div class="brand-name"><strong>ymaanyGO</strong><span>Chauffeurs Portaal</span></div>
      </a>
      <nav><a class="btn" href="https://ymaanygo.nl/admin/driver/chauffeurs-registratie.html">chauffeur worden</a></nav>
    </div>
  </div>
</header>
<main>
  <div class="login-container">
    <div class="login-heading">Chauffeur Login</div>
    <div class="login-sub">Inloggen voor chauffeurs</div>
    <form id="loginForm" class="login-form">
      <input required class="login-input" type="email" id="email" placeholder="E-mailadres">
      <div class="pw-row">
        <input required class="login-input" type="password" id="password" placeholder="Wachtwoord">
        <button class="toggle" type="button" id="togglePw">TOON</button>
      </div>
      <button class="login-button" type="submit" id="loginBtn">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Inloggen</span>
      </button>
      <div id="msgErr" class="msg err"></div>
      <div id="msgOk" class="msg ok">Succesvol ingelogd...</div>
      <div class="hint">Nog geen chauffeur account? <a href="https://ymaanygo.nl/chauffeur/nieuw-chauffeur-registreren.html">Registreren</a></div>
    </form>
  </div>
</main>
<footer>© 2026 ymaanyGO</footer>

<script>
const db = supabase.createClient(
  "https://lxbfobdczjgqnotwsnki.supabase.co",
  "sb_publishable_H5HKGlHBe9z3ejn0B-NKsw_9Mo-MIhp"
);

const $ = id => document.getElementById(id);

$("togglePw").addEventListener("click",()=>{
  const isPw = $("password").type === "password";
  $("password").type = isPw ? "text" : "password";
  $("togglePw").textContent = isPw ? "VERBERG" : "TOON";
});

$("loginForm").addEventListener("submit", async(e) => {
  e.preventDefault();

  $("msgErr").style.display = "none";
  $("msgOk").style.display = "none";
  $("loginBtn").disabled = true;
  $("spinner").style.display = "block";
  $("btnText").textContent = "Bezig...";

  const userEmail = $("email").value.trim();
  const userPassword = $("password").value.trim();

  // 1. Inloggen
  const { data, error } = await db.auth.signInWithPassword({
    email: userEmail,
    password: userPassword
  });

  if(error){
    $("loginBtn").disabled = false;
    $("spinner").style.display = "none";
    $("btnText").textContent = "Inloggen";
    $("msgErr").textContent = "Onjuiste login gegevens.";
    $("msgErr").style.display = "block";
    return;
  }

  const user = data.user;

  // 2. Zoek profiel op ID (niet email!)
  const { data: profile } = await db
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if(!profile){
    await db.auth.signOut();
    $("loginBtn").disabled = false;
    $("spinner").style.display = "none";
    $("btnText").textContent = "Inloggen";
    $("msgErr").textContent = "Geen profiel gevonden.";
    $("msgErr").style.display = "block";
    return;
  }

  if(profile.role !== "driver"){
    await db.auth.signOut();
    $("loginBtn").disabled = false;
    $("spinner").style.display = "none";
    $("btnText").textContent = "Inloggen";
    $("msgErr").textContent = "Geen chauffeur toegang.";
    $("msgErr").style.display = "block";
    return;
  }

  // 3. Succesvol ingelogd
  $("msgOk").style.display = "block";
  window.location.href = "/chauffeur/dashboard/index.html";
});
</script>
</body>
</html>
