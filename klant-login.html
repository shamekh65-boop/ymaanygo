<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klant login – ymaanyGO</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2ecc71">
<link rel="icon" href="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg-light:#f6fbf8;--bg-mid:#e6f3ed;--bg-dark:#d7ece2;
  --text:#0b2e1f;--muted:#4f7f68;--line:rgba(0,0,0,.08);
  --accent:#2ecc71;--accent2:#27ae60;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:linear-gradient(to bottom,var(--bg-light),var(--bg-mid),var(--bg-dark));
  color:var(--text);display:flex;flex-direction:column;
}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px;width:100%}
header{
  background:linear-gradient(to bottom,rgba(245,248,246,.95),rgba(210,232,220,.92));
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;
}
.header-inner{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{width:46px;height:46px;border-radius:12px;background:#fff;padding:6px;border:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.brand strong{display:block;font-size:15px}.brand span{font-size:12px;color:var(--muted)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:34px 0}
.card{
  width:100%;max-width:410px;background:linear-gradient(0deg,#fff,#f0f8f4);
  border:1px solid var(--line);border-radius:28px;padding:26px 30px;
  box-shadow:0 22px 30px -18px rgba(11,46,31,.35);
}
h1{text-align:center;font-size:27px;font-weight:900}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef6f1;border-radius:16px;padding:5px;margin-top:20px}
.tabs button{border:0;background:transparent;padding:11px;border-radius:13px;font-weight:900;color:var(--muted)}
.tabs button.active{background:#fff;color:var(--text);box-shadow:0 8px 18px rgba(0,0,0,.06)}
.form{margin-top:16px}
.input{
  width:100%;background:#fff;border:0;padding:14px 18px;border-radius:16px;margin-top:12px;
  font-size:14px;color:var(--text);box-shadow:0 10px 12px -8px rgba(46,204,113,.35);
  border-inline:2px solid transparent;
}
.input:focus{outline:none;border-inline:2px solid var(--accent)}
.pw-row{position:relative}
.toggle{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:900;font-size:12px;
}
.btn{
  width:100%;border:0;cursor:pointer;background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#fff;padding:15px;border-radius:18px;font-size:16px;font-weight:900;margin-top:18px;
  box-shadow:0 16px 22px -14px rgba(46,204,113,.6);
}
.btn:disabled{opacity:.7}
.msg{display:none;margin-top:14px;padding:12px 14px;border-radius:14px;font-size:14px}
.err{background:rgba(231,76,60,.08);color:#b42318}
.ok{background:rgba(46,204,113,.08);color:#146c3c}
.small{text-align:center;margin-top:12px;font-size:12px;color:var(--muted)}
.small a{color:var(--accent2);font-weight:800;text-decoration:none}
.hidden{display:none}
footer{text-align:center;padding:18px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}

.divider{
  display:flex;align-items:center;gap:10px;margin:18px 0;
  color:var(--muted);font-size:12px;font-weight:800;
}
.divider::before,.divider::after{
  content:"";flex:1;height:1px;background:var(--line);
}
.social-btn{
  width:100%;border:1px solid var(--line);cursor:pointer;background:#fff;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:13px;border-radius:16px;font-size:14px;font-weight:800;color:var(--text);
  margin-top:10px;
}
.social-btn:active{opacity:.85}
.social-btn.apple{background:#000;color:#fff;border-color:#000}
.social-btn svg{width:18px;height:18px;flex-shrink:0}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <div class="header-inner">
      <a class="brand" href="/">
        <img class="logo" src="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico" alt="ymaanyGO">
        <div>
          <strong>ymaanyGO</strong>
          <span>Klant portaal</span>
        </div>
      </a>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="card">
      <h1 id="title">Klant login</h1>
      <div class="sub" id="subtitle">Log in of maak een account aan</div>

      <div class="tabs">
        <button id="loginTab" class="active" type="button" onclick="setMode('login')">Inloggen</button>
        <button id="registerTab" type="button" onclick="setMode('register')">Registreren</button>
      </div>

      <form id="authForm" class="form">
        <div id="registerFields" class="hidden">
          <input class="input" id="name" type="text" placeholder="Naam">
          <input class="input" id="phone" type="tel" placeholder="Telefoonnummer">
        </div>

        <input class="input" id="email" type="email" placeholder="E-mailadres" required>

        <div class="pw-row">
          <input class="input" id="password" type="password" placeholder="Wachtwoord" required minlength="6">
          <button class="toggle" type="button" onclick="togglePassword()" id="toggleBtn">TOON</button>
        </div>

        <button class="btn" id="submitBtn" type="submit">Inloggen</button>

        <div id="msgErr" class="msg err"></div>
        <div id="msgOk" class="msg ok"></div>
      </form>

      <div class="divider">OF</div>

      <button class="social-btn" type="button" onclick="loginWithGoogle()">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
        Doorgaan met Google
      </button>

      <button class="social-btn apple" type="button" onclick="appleComingSoon()">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.332-1.26-3.428-2.8-1.287-1.82-2.323-4.63-2.323-7.28 0-4.28 2.797-6.55 5.552-6.55 1.448 0 2.675.95 3.6.95.865 0 2.222-1.01 3.902-1.01.613 0 2.886.06 4.374 2.19-.13.09-2.383 1.37-2.383 4.19 0 3.26 2.854 4.42 2.955 4.45z"/></svg>
        Doorgaan met Apple
      </button>

      <div class="small">
        Na login ga je naar <a href="/boeken/index.html">boeken</a>
      </div>
    </section>
  </div>
</main>

<footer>© 2026 ymaanyGO</footer>

<script>
const SUPABASE_URL = "https://lxbfobdczjgqnotwsnki.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_H5HKGlHBe9z3ejn0B-NKsw_9Mo-MIhp";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let mode = "login";

const form = document.getElementById("authForm");
const nameInput = document.getElementById("name");
const phoneInput = document.getElementById("phone");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const msgErr = document.getElementById("msgErr");
const msgOk = document.getElementById("msgOk");
const submitBtn = document.getElementById("submitBtn");

function show(el){ el.style.display = "block"; }
function hide(el){ el.style.display = "none"; }

function setMode(m){
  mode = m;

  document.getElementById("loginTab").classList.toggle("active", m === "login");
  document.getElementById("registerTab").classList.toggle("active", m === "register");
  document.getElementById("registerFields").classList.toggle("hidden", m !== "register");

  document.getElementById("title").textContent = m === "login" ? "Klant login" : "Account maken";
  document.getElementById("subtitle").textContent = m === "login"
    ? "Log in met je klantaccount"
    : "Maak gratis een klantaccount aan";

  submitBtn.textContent = m === "login" ? "Inloggen" : "Registreren";

  hide(msgErr);
  hide(msgOk);
}

function togglePassword(){
  const isPw = passwordInput.type === "password";
  passwordInput.type = isPw ? "text" : "password";
  document.getElementById("toggleBtn").textContent = isPw ? "VERBERG" : "TOON";
}

function setLoading(v){
  submitBtn.disabled = v;
  submitBtn.textContent = v ? "Bezig..." : (mode === "login" ? "Inloggen" : "Registreren");
}

async function createOrUpdateProfile(user, extra = {}){
  const payload = {
    id: user.id,
    email: user.email,
    name: extra.name || user.email,
    phone: extra.phone || "",
    role: "klant"
  };

  const { error } = await db
    .from("profiles")
    .upsert(payload, { onConflict: "id" });

  if(error) throw error;
}

async function loginWithGoogle(){
  hide(msgErr);
  const { error } = await db.auth.signInWithOAuth({
    provider: "google",
    options:{
      redirectTo: window.location.origin + "/boeken/index.html"
    }
  });

  if(error){
    msgErr.textContent = error.message || "Er is iets fout gegaan.";
    show(msgErr);
  }
}

function appleComingSoon(){
  hide(msgOk);
  msgErr.textContent = "Inloggen met Apple komt binnenkort beschikbaar. Log voorlopig in met Google of e-mail.";
  show(msgErr);
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  hide(msgErr);
  hide(msgOk);
  setLoading(true);

  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();

  try{
    if(mode === "register"){
      if(!name || !phone){
        throw new Error("Vul naam en telefoonnummer in.");
      }

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options:{
          data:{
            name,
            phone,
            role:"klant"
          }
        }
      });

      if(error) throw error;

      if(data.user){
        await createOrUpdateProfile(data.user, { name, phone });
      }

      msgOk.textContent = "Account aangemaakt. Je wordt doorgestuurd...";
      show(msgOk);

      setTimeout(()=>{
        window.location.href = "/boeken/index.html";
      }, 800);

      return;
    }

    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    const user = data.user;

    const { data: profile, error: profileError } = await db
      .from("profiles")
      .select("*")
      .eq("email", user.email)
      .maybeSingle();

    if(profileError) throw profileError;

    if(!profile){
      await createOrUpdateProfile(user, {
        name: user.user_metadata?.name || user.email,
        phone: user.user_metadata?.phone || ""
      });
    }else if(profile.role !== "klant"){
      throw new Error("Dit account is geen klantaccount.");
    }

    msgOk.textContent = "Succesvol ingelogd. Doorsturen...";
    show(msgOk);

    setTimeout(()=>{
      window.location.href = "/boeken/index.html";
    }, 600);

  }catch(err){
    msgErr.textContent = err.message || "Er is iets fout gegaan.";
    show(msgErr);
    setLoading(false);
  }
});

// تحقق من وجود جلسة بعد رجوع المستخدم من Google OAuth
db.auth.getSession().then(async ({ data: { session } }) => {
  if(session && session.user){
    const user = session.user;
    const { data: profile } = await db
      .from("profiles")
      .select("*")
      .eq("email", user.email)
      .maybeSingle();

    if(!profile){
      await createOrUpdateProfile(user, {
        name: user.user_metadata?.full_name || user.user_metadata?.name || user.email,
        phone: user.user_metadata?.phone || ""
      });
    }
  }
});
</script>

</body>
</html>
