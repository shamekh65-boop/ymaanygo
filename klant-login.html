<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Inloggen klanten – ymaanyGO</title>
  <meta name="description" content="Inlogpagina voor klanten van ymaanyGO.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2ecc71">

  <link rel="icon" href="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico">

  <style>
    :root{
      --bg-light:#f6fbf8;
      --bg-mid:#e6f3ed;
      --bg-dark:#d7ece2;
      --panel:rgba(255,255,255,.92);
      --text:#0b2e1f;
      --muted:#4f7f68;
      --line:rgba(0,0,0,.08);
      --accent:#2ecc71;
      --accent2:#27ae60;
      --radius:18px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      background: linear-gradient(to bottom,var(--bg-light) 0%,var(--bg-mid) 60%,var(--bg-dark) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      line-height:1.5;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .wrap{ max-width:1100px; margin:0 auto; padding:0 18px; width:100%; }

    header{
      background: linear-gradient(to bottom, rgba(245,248,246,.95), rgba(210,232,220,.92));
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:10;
    }

    .header-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 0;
      gap:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color:var(--text);
    }

    .logo{
      width:46px;
      height:46px;
      border-radius:12px;
      background:#fff;
      padding:6px;
      border:1px solid var(--line);
      object-fit:contain;
    }

    .brand-name{ display:flex; flex-direction:column; gap:1px; }
    .brand-name strong{ font-size:15px; }
    .brand-name span{ font-size:12.5px; color:var(--muted); }

    nav{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

    .btn{
      padding:10px 16px;
      border-radius:14px;
      font-weight:700;
      text-decoration:none;
      color:#fff;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      box-shadow:0 10px 22px rgba(46,204,113,.25);
      white-space:nowrap;
      display:inline-block;
    }

    main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:34px 0;
    }

    /* ===== Customer Login Card ===== */
    .login-container{
      max-width: 380px;
      margin: 0 auto;
      background: linear-gradient(0deg, rgba(255,255,255,1) 0%, rgba(240,248,244,1) 100%);
      border-radius: 28px;
      padding: 26px 30px;
      border: 1px solid var(--line);
      box-shadow: 0 22px 30px -18px rgba(11,46,31,.35);
      width:100%;
    }

    .login-heading{
      text-align:center;
      font-weight:900;
      font-size:26px;
      color:var(--text);
    }

    .login-sub{
      text-align:center;
      color:var(--muted);
      font-size:14px;
      margin-top:6px;
    }

    .login-form{ margin-top:18px; }

    .login-input{
      width:100%;
      background:#fff;
      border:none;
      padding:14px 18px;
      border-radius:16px;
      margin-top:14px;
      font-size:14px;
      color:var(--text);
      box-shadow: 0 10px 12px -8px rgba(46,204,113,.35);
      border-inline:2px solid transparent;
    }

    .login-input::placeholder{ color:var(--muted); }

    .login-input:focus{
      outline:none;
      border-inline:2px solid var(--accent);
    }

    .pw-row{ position:relative; }

    .toggle{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      cursor:pointer;
      padding:6px 8px;
      border-radius:10px;
      color:var(--muted);
      font-weight:800;
      font-size:12px;
    }

    .toggle:hover{ background: rgba(46,204,113,.10); color: var(--text); }

    .row-actions{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:10px;
      padding:0 6px;
      flex-wrap:wrap;
    }

    .row-actions a{
      font-size:12px;
      color:var(--accent2);
      text-decoration:none;
      white-space:nowrap;
    }

    .remember{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--muted);
      font-size:13px;
      user-select:none;
      white-space:nowrap;
    }

    .remember input{
      width:18px;
      height:18px;
      accent-color: var(--accent2);
    }

    .login-button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      font-weight:800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color:#fff;
      padding:14px;
      margin:18px auto 0;
      border-radius:18px;
      border:none;
      cursor:pointer;
      box-shadow:0 16px 22px -14px rgba(46,204,113,.6);
      transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }

    .login-button:hover{
      transform:scale(1.02);
      opacity:.97;
      box-shadow:0 20px 26px -14px rgba(46,204,113,.7);
    }

    .login-button:active{ transform:scale(.98); }

    .spinner{
      width:16px;
      height:16px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.45);
      border-top-color:#fff;
      display:none;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg);} }

    .msg{
      display:none;
      margin:12px 0 0;
      padding:12px 14px;
      border-radius:14px;
      font-size:14px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
    }
    .msg.err{ border-color: rgba(231,76,60,.35); background: rgba(231,76,60,.08); }
    .msg.ok{ border-color: rgba(46,204,113,.35); background: rgba(46,204,113,.08); }

    .agreement{
      display:block;
      text-align:center;
      margin-top:14px;
    }

    .agreement a{
      text-decoration:none;
      color:var(--muted);
      font-size:11px;
    }

    .hint{
      text-align:center;
      margin-top:10px;
      font-size:12px;
      color:var(--muted);
    }

    footer{
      text-align:center;
      padding:18px 0;
      color:var(--muted);
      font-size:13px;
      border-top:1px solid var(--line);
      background:rgba(255,255,255,.20);
    }
  </style>
</head>

<body>

<header>
  <div class="wrap">
    <div class="header-inner">
      <a class="brand" href="/">
        <img class="logo"
             src="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico"
             alt="ymaanyGO">
        <div class="brand-name">
          <strong>ymaanyGO</strong>
          <span>Taxi • Nederland • DE/BE luchthavens</span>
        </div>
      </a>
      <nav>
        <a class="btn" href="https://ymaanygo.nl/taxi.html">Taxi boeken</a>
      </nav>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="login-container" aria-live="polite">
      <div class="login-heading">Inloggen klanten</div>
      <div class="login-sub">Toegang tot je klantenportaal</div>

      <form id="loginFormCustomer" class="login-form" action="#" method="post" novalidate>
        <input required class="login-input" type="text" name="email" id="email"
               placeholder="E-mail of klantnummer" autocomplete="username">

        <div class="pw-row">
          <input required class="login-input" type="password" name="password" id="password"
                 placeholder="Wachtwoord" autocomplete="current-password" minlength="4">
          <button class="toggle" type="button" id="togglePw" aria-label="Wachtwoord tonen/verbergen">TOON</button>
        </div>

        <div class="row-actions">
          <label class="remember">
            <input type="checkbox" id="remember">
            Onthouden
          </label>

          <a href="#" id="forgot">Wachtwoord vergeten?</a>
        </div>

        <button class="login-button" type="submit" id="loginBtn">
          <span class="spinner" id="spin" aria-hidden="true"></span>
          <span id="btnText">Inloggen</span>
        </button>

        <div id="msgErr" class="msg err" role="alert">Onjuiste gegevens. Controleer je invoer.</div>
        <div id="msgOk" class="msg ok" role="status">Succes! Doorsturen…</div>

        <div class="hint">
          Nog geen account? <a href="/registreren.html" style="color:var(--accent2); text-decoration:none; font-weight:800;">Registreren</a>
        </div>
      </form>

      <span class="agreement">
        <a href="/">Terug naar de website</a>
      </span>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    &copy; 2026 ymaanyGO.
  </div>
</footer>

<script>
  // ===== Demo customer login (tijdelijke accounts) =====
  // ملاحظة: هذا للعرض فقط. في الإنتاج لازم Backend/API حقيقي.
  const CUSTOMERS = {
    "klant01": "1111",
    "klant02": "2222",
    "customer": "1234",
    "test@demo.nl": "1111"
  };

  const form = document.getElementById('loginFormCustomer');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const remember = document.getElementById('remember');

  const msgErr = document.getElementById('msgErr');
  const msgOk  = document.getElementById('msgOk');

  const togglePw = document.getElementById('togglePw');
  const btn = document.getElementById('loginBtn');
  const spin = document.getElementById('spin');
  const btnText = document.getElementById('btnText');

  function show(el){ el.style.display = 'block'; }
  function hide(el){ el.style.display = 'none'; }

  togglePw.addEventListener('click', () => {
    const isPw = password.type === 'password';
    password.type = isPw ? 'text' : 'password';
    togglePw.textContent = isPw ? 'VERBERG' : 'TOON';
  });

  const savedUser = localStorage.getItem('ymaanygo_customer_user');
  if (savedUser) {
    email.value = savedUser;
    remember.checked = true;
  }

  document.getElementById('forgot').addEventListener('click', (e) => {
    e.preventDefault();
    hide(msgOk);
    msgErr.textContent = "Neem contact op met support om je wachtwoord te resetten.";
    show(msgErr);
  });

  function setLoading(isLoading){
    btn.disabled = isLoading;
    spin.style.display = isLoading ? 'inline-block' : 'none';
    btnText.textContent = isLoading ? 'Bezig…' : 'Inloggen';
    btn.style.opacity = isLoading ? '0.85' : '1';
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    hide(msgErr); hide(msgOk);

    const u = (email.value || '').trim();
    const p = (password.value || '').trim();

    if (!u || !p) {
      msgErr.textContent = "Vul je e-mail/klantnummer en wachtwoord in.";
      show(msgErr);
      return;
    }

    setLoading(true);

    setTimeout(() => {
      const ok = CUSTOMERS[u] && CUSTOMERS[u] === p;

      if (!ok) {
        setLoading(false);
        msgErr.textContent = "Onjuiste gegevens. Probeer opnieuw.";
        show(msgErr);
        return;
      }

      if (remember.checked) localStorage.setItem('ymaanygo_customer_user', u);
      else localStorage.removeItem('ymaanygo_customer_user');

      localStorage.setItem('ymaanygo_customer_session', u);

      show(msgOk);
      window.location.href = "/klant-dashboard.html";
    }, 650);
  });
</script>

</body>
</html>
