  <!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7d32" />
  <title>ymaanyGO – Klant Dashboard</title>
  <link rel="icon" href="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico">

  <style>
    :root{
      --bg:#f6f6f6;
      --card:#ffffff;
      --text:#111;
      --muted:rgba(0,0,0,.60);
      --border:rgba(0,0,0,.10);
      --shadow:0 12px 26px rgba(0,0,0,.10);
      --radius:18px;

      /* Brand */
      --accent:#2f7d32;
      --accent2:#3bbf6b;

      /* Controls */
      --control-h:52px;
      --control-radius:18px;

      /* Bottom nav */
      --nav-h:72px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
    }

    a{color:inherit;text-decoration:none}
    button{font-family:inherit}
    .hidden{display:none !important}

    /* ===== App shell ===== */
    .wrap{max-width:820px;margin:0 auto;padding:0 14px;}
    .top{
      position:sticky; top:0; z-index:50;
      background:rgba(246,246,246,.85);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border-bottom:1px solid var(--border);
    }
    .top-inner{
      max-width:820px;margin:0 auto;
      padding:10px 14px;
      display:flex;align-items:center;gap:10px;
    }

    .logo{
      height:34px;
      width:auto;
      display:block;
      object-fit:contain;
    }

    .pill{
      margin-left:auto;
      display:flex;align-items:center;gap:10px;
    }

    .icon-btn{
      width:44px;height:44px;
      border-radius:16px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:0 10px 18px rgba(0,0,0,.08);
      cursor:pointer;
      display:grid;place-items:center;
    }
    .icon-btn:active{transform:translateY(1px)}

    .page{
      padding:14px 0 18px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .card.pad{padding:14px}
    .section-title{
      font-weight:900;
      font-size:18px;
      margin:6px 0 10px;
    }
    .subtle{color:var(--muted);font-size:13px}

    /* ===== Profile header (Account) ===== */
    .profile{
      text-align:center;
      padding:16px 14px 10px;
      background:linear-gradient(180deg, rgba(59,191,107,.10), rgba(255,255,255,0));
    }
    .avatar{
      width:82px;height:82px;border-radius:999px;
      background:rgba(0,0,0,.06);
      margin:4px auto 10px;
      display:grid;place-items:center;
      position:relative;
    }
    .avatar svg{opacity:.75}
    .name{font-weight:900;font-size:18px;margin:0}
    .email{margin:4px 0 0;color:var(--muted);font-size:13px}

    /* ===== List rows ===== */
    .list{display:flex;flex-direction:column}
    .row{
      display:flex;align-items:center;gap:12px;
      padding:14px;
      border-top:1px solid rgba(0,0,0,.06);
      background:#fff;
      cursor:pointer;
    }
    .row:first-child{border-top:0}
    .row:hover{background:rgba(0,0,0,.015)}
    .row .left{
      width:40px;height:40px;border-radius:14px;
      border:1px solid rgba(47,125,50,.22);
      background:rgba(59,191,107,.10);
      display:grid;place-items:center;
      flex:0 0 40px;
    }
    .row .mid{flex:1;min-width:0}
    .row .t{font-weight:900}
    .row .d{font-size:13px;color:var(--muted);margin-top:2px}
    .row .chev{opacity:.55}

    /* ===== Search bar (Home) ===== */
    .search{
      display:flex;align-items:center;gap:10px;
      height:var(--control-h);
      border-radius:999px;
      border:1px solid rgba(0,0,0,.10);
      background:rgba(255,255,255,.92);
      box-shadow:0 10px 18px rgba(0,0,0,.08);
      padding:0 14px;
    }
    .search input{
      border:0;outline:0;background:transparent;
      width:100%;
      font-size:16px;
    }

    .hero{
      display:grid;gap:12px;
    }

    .promo{
      border-radius:22px;
      padding:16px;
      background:linear-gradient(135deg, rgba(47,125,50,.95), rgba(59,191,107,.80));
      color:#fff;
      box-shadow:0 20px 34px rgba(0,0,0,.16);
      position:relative;
      overflow:hidden;
    }
    .promo h3{margin:0 0 6px;font-size:20px}
    .promo p{margin:0;opacity:.92}
    .promo .btn{
      margin-top:12px;
      width:fit-content;
      border:0;
      background:rgba(255,255,255,.92);
      color:#111;
      font-weight:900;
      padding:12px 16px;
      border-radius:14px;
      cursor:pointer;
    }
    .promo .blob{
      position:absolute;right:-40px;top:-40px;
      width:160px;height:160px;border-radius:999px;
      background:rgba(255,255,255,.14);
      filter: blur(0px);
    }

    /* ===== Rides empty ===== */
    .empty{
      text-align:center;
      padding:28px 14px;
    }
    .empty .ic{
      width:64px;height:64px;border-radius:999px;
      background:rgba(59,191,107,.12);
      border:1px solid rgba(47,125,50,.20);
      margin:0 auto 12px;
      display:grid;place-items:center;
    }
    .empty h2{margin:0 0 6px;font-size:22px}
    .empty p{margin:0;color:var(--muted)}
    .primary{
      margin-top:14px;
      width:100%;
      height:56px;
      border:0;
      border-radius:28px;
      background:linear-gradient(180deg, var(--accent2), var(--accent));
      color:#fff;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      box-shadow:0 14px 26px rgba(0,0,0,.16);
    }
    .primary:active{transform:translateY(1px) scale(.99)}

    /* ===== Tabs (Rides) ===== */
    .seg{
      display:flex; gap:10px;
      background:rgba(0,0,0,.05);
      border:1px solid rgba(0,0,0,.06);
      border-radius:999px;
      padding:8px;
      overflow:hidden;
    }
    .seg button{
      flex:1;
      height:44px;
      border-radius:999px;
      border:0;
      cursor:pointer;
      font-weight:900;
      background:transparent;
      color:rgba(0,0,0,.55);
    }
    .seg button.active{
      background:#fff;
      color:#111;
      box-shadow:0 10px 16px rgba(0,0,0,.10);
    }

    /* ===== Bottom Nav ===== */
    .bottom{
      position:fixed; left:0; right:0; bottom:0;
      height:calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding-bottom:env(safe-area-inset-bottom);
      background:rgba(255,255,255,.92);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border-top:1px solid var(--border);
      z-index:90;
    }
    .bottom-inner{
      max-width:820px;margin:0 auto;
      height:var(--nav-h);
      display:flex;align-items:center;justify-content:space-around;
      padding:8px 10px;
    }
    .tab{
      width:110px;
      display:flex;flex-direction:column;align-items:center;gap:6px;
      border:0;background:transparent;cursor:pointer;
      color:rgba(0,0,0,.45);
      font-weight:900;
      padding:8px 10px;border-radius:16px;
    }
    .tab svg{opacity:.6}
    .tab.active{
      color:var(--accent);
    }
    .tab.active svg{opacity:1}
    .tab:active{transform:translateY(1px)}

    /* ===== Sheets (Bottom modals) ===== */
    .overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,.30);
      z-index:120;
      display:none;
    }
    .overlay.show{display:block}
    .sheet{
      position:fixed; left:0; right:0; bottom:-150%;
      z-index:121;
      transition:bottom .22s ease;
      padding:10px 10px calc(14px + env(safe-area-inset-bottom));
    }
    .sheet.open{bottom:0}
    .sheet-card{
      max-width:820px;margin:0 auto;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(0,0,0,.08);
      border-radius:22px;
      box-shadow:0 30px 80px rgba(0,0,0,.22);
      overflow:hidden;
    }
    .sheet-grip{
      width:48px;height:5px;border-radius:999px;
      background:rgba(0,0,0,.18);
      margin:10px auto 0;
    }
    .sheet-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px;
      border-bottom:1px solid rgba(0,0,0,.06);
    }
    .sheet-title{font-weight:900;font-size:18px}
    .sheet-x{
      width:42px;height:42px;border-radius:16px;
      border:1px solid rgba(0,0,0,.10);
      background:#fff;
      cursor:pointer;
      font-size:20px; line-height:1;
    }
    .sheet-body{padding:12px 14px}
    .sheet-actions{padding:12px 14px; border-top:1px solid rgba(0,0,0,.06)}
    .btn-ghost{
      width:100%;
      height:52px;border-radius:18px;
      border:1px solid rgba(0,0,0,.12);
      background:#fff;
      font-weight:900;
      cursor:pointer;
    }

    /* ===== Forms in sheets ===== */
    .field{
      display:grid; gap:8px;
      margin:10px 0;
    }
    .field label{font-size:13px;font-weight:900;color:rgba(0,0,0,.75)}
    .field input{
      height:48px;
      border-radius:16px;
      border:1px solid rgba(0,0,0,.14);
      padding:0 12px;
      font-size:16px;
      outline:none;
      background:#fff;
    }
    .field input:focus{border-color:#111}

    .radio-row{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 2px;
      border-top:1px solid rgba(0,0,0,.06);
      cursor:pointer;
    }
    .radio-row:first-child{border-top:0}
    .radio-row .l{display:flex;align-items:center;gap:10px}
    .dot{
      width:20px;height:20px;border-radius:999px;
      border:2px solid rgba(0,0,0,.25);
      display:grid;place-items:center;
    }
    .dot i{
      width:10px;height:10px;border-radius:999px;
      background:var(--accent);
      display:none;
    }
    .radio-row.active .dot{border-color:var(--accent)}
    .radio-row.active .dot i{display:block}

    /* ===== RTL (Arabic) ===== */
    body[dir="rtl"] .top-inner{flex-direction:row-reverse}
    body[dir="rtl"] .pill{margin-left:0;margin-right:auto}
    body[dir="rtl"] .row{flex-direction:row-reverse}
    body[dir="rtl"] .row .mid{text-align:right}
    body[dir="rtl"] .sheet-head{flex-direction:row-reverse}
    body[dir="rtl"] .radio-row{flex-direction:row-reverse}
    body[dir="rtl"] .radio-row .l{flex-direction:row-reverse}
    /* ===== Taxi (embedded) – namespaced ===== */
.tx-wrap{display:grid;gap:12px}
.tx-route-panel{background:rgba(0,0,0,.04);border-radius:18px;padding:12px}
.tx-route-title{text-align:center;font-size:24px;font-weight:900;margin:0 0 10px}
.tx-route-box{position:relative;border:2px solid var(--accent);border-radius:20px;background:var(--card);padding:8px;display:grid;gap:8px}
.tx-route-row{display:flex;align-items:center;gap:10px}
.tx-dot{width:10px;height:10px;border-radius:50%;flex:0 0 12px;background:#bbb;border:1px solid rgba(0,0,0,.06)}
.tx-dot.start{background:#5b5bff}
.tx-dot.end{background:#21a366}

.tx-field{flex:1;display:flex;align-items:center;gap:10px;border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.92);border-radius:16px;padding:0 10px;height:52px;min-width:0}
.tx-glass{width:18px;height:18px;border:2px solid var(--text);border-radius:50%;position:relative;flex:0 0 18px;opacity:.8}
.tx-glass::after{content:"";position:absolute;width:9px;height:2px;background:var(--text);right:-7px;bottom:-3px;transform:rotate(45deg);border-radius:2px}

.tx-field input{border:0 !important;outline:0 !important;background:transparent !important;height:100%;width:100%;font-size:16px}
.tx-icon{width:44px;height:44px;border-radius:14px;border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.92);cursor:pointer;display:grid;place-items:center;flex:0 0 44px}
.tx-swap{position:absolute;right:-10px;top:50%;transform:translate(100%,-50%);width:42px;height:42px;border-radius:16px;border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.92);cursor:pointer;box-shadow:0 10px 18px rgba(0,0,0,.12)}

.tx-suggest-wrap{position:relative;flex:1;min-width:0}
.tx-suggest{position:absolute;left:0;right:0;top:calc(52px + 6px);background:var(--card);border:1px solid rgba(0,0,0,.14);border-radius:14px;box-shadow:0 14px 28px rgba(0,0,0,.14);overflow:hidden;z-index:9999;max-height:240px;overflow-y:auto}
.tx-item{padding:10px 12px;font-size:14px;cursor:pointer;border-top:1px solid rgba(0,0,0,.08)}
.tx-item:first-child{border-top:0}
.tx-item:hover{background:rgba(0,0,0,.04)}
.tx-muted{opacity:.7;font-size:12px;margin-top:2px}

.tx-grid{display:grid;gap:12px}
.tx-row{display:grid;gap:10px}
@media(min-width:760px){.tx-row.two{grid-template-columns:1fr 1fr}}
.tx-inline{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(0,0,0,.12);border-radius:14px;background:rgba(255,255,255,.92)}
.tx-inline input{width:auto;height:auto}

.tx-actions{display:flex;gap:12px}
.tx-actions button{flex:1;height:56px;border-radius:28px;border:0;cursor:pointer;font-weight:900;font-size:16px;box-shadow:0 14px 26px rgba(0,0,0,.16)}
.tx-actions .a{background:linear-gradient(180deg, var(--accent2), var(--accent));color:#fff}
.tx-actions .b{background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.12);color:var(--text)}

.tx-price{font-size:18px;font-weight:900}
.tx-meta{font-size:13px;color:var(--muted)}
.tx-note{font-size:12px;color:#c00}

/* Fullscreen Picker */
#txModal{position:fixed;inset:0;background:var(--card);z-index:200;display:none;flex-direction:column}
#txModal.open{display:flex}
.tx-picker-top{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.tx-back{width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.92);box-shadow:0 10px 20px rgba(0,0,0,.10);cursor:pointer;font-size:20px}
.tx-pick-search{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);border:2px solid var(--accent);border-radius:18px;padding:10px 12px;box-shadow:0 10px 18px rgba(0,0,0,.10)}
.tx-pick-search input{border:0 !important;outline:none !important;background:transparent !important;font-size:18px;width:100%}
.tx-pick-search button{width:38px;height:38px;border-radius:14px;border:0;background:rgba(0,0,0,.06);cursor:pointer}
.tx-mapwrap{position:relative;flex:1;min-height:0}
#txMap{width:100%;height:100%}
.tx-pin{position:absolute;left:50%;top:50%;width:26px;height:44px;transform:translate(-50%,-100%);z-index:500;pointer-events:none}
.tx-pin::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:var(--accent);box-shadow:0 12px 22px rgba(0,0,0,.25)}
.tx-pin::after{content:"";position:absolute;left:50%;top:22px;transform:translateX(-50%);width:6px;height:22px;border-radius:0 0 6px 6px;background:var(--accent)}
.tx-pin span{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#fff}
.tx-bottom{padding:12px 14px 18px;background:var(--card);box-shadow:0 -16px 30px rgba(0,0,0,.10)}
.tx-picked{font-size:18px;font-weight:900;margin:6px 0 10px}
.tx-confirm{width:100%;border:0;border-radius:18px;padding:16px;background:var(--accent);color:#fff;font-weight:900;font-size:18px;cursor:pointer}

/* In-app alert */
#txAlert{position:fixed;inset:0;background:rgba(0,0,0,.18);backdrop-filter: blur(14px) saturate(140%);-webkit-backdrop-filter: blur(14px) saturate(140%);z-index:99999;display:none;align-items:center;justify-content:center;padding:18px}
#txAlert.show{display:flex}
.tx-alert-card{width:min(520px,100%);border-radius:22px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.55);box-shadow:0 24px 70px rgba(0,0,0,.22);padding:16px}
.tx-alert-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.tx-alert-title{font-weight:900;font-size:18px}
.tx-alert-x{width:42px;height:42px;border-radius:16px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.65);cursor:pointer;font-size:20px}
.tx-alert-msg{font-size:15px;line-height:1.45;padding:8px 2px 14px;white-space:pre-line}
.tx-alert-ok{width:100%;border:0;border-radius:18px;padding:14px;background:var(--accent);color:#fff;font-weight:900;font-size:16px;cursor:pointer}
.tx-stops{display:grid;gap:8px;margin-top:8px}
.tx-stop-row{display:flex;align-items:center;gap:10px}
.tx-stop-tag{width:10px;height:10px;border-radius:50%;flex:0 0 12px;background:#ff9800;border:1px solid rgba(0,0,0,.06)}
.tx-remove{width:44px;height:44px;border-radius:14px;border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.92);cursor:pointer}

.tx-addstop{
  margin-top:10px;
  width:100%;
  height:48px;
  border-radius:16px;
  border:1px dashed rgba(0,0,0,.25);
  background:rgba(255,255,255,.75);
  font-weight:900;
  cursor:pointer;
}  
  </style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

  <!-- Top -->
  <div class="top">
    <div class="top-inner">
      <img class="logo" src="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/logo.png" alt="ymaanyGO"
           onerror="this.src='https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/logo.jpeg'">

      <div class="pill">
        <button class="icon-btn" type="button" aria-label="Language" onclick="openSheet('langSheet')">
          <!-- globe -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M2 12h20"></path>
            <path d="M12 2a15 15 0 0 1 0 20"></path>
            <path d="M12 2a15 15 0 0 0 0 20"></path>
          </svg>
        </button>

        <button class="icon-btn" type="button" aria-label="Theme" onclick="openSheet('themeSheet')">
          <!-- sun/moon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Pages -->
  <div class="wrap">
    <!-- HOME -->
    <section id="pageHome" class="page">
      <div class="hero">
        <div class="card pad">
          <div class="search" onclick="goTaxi()">
            <!-- search icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.75">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M21 21l-4.3-4.3"></path>
            </svg>
            <input id="homeSearch" type="text" readonly value="" />
          </div>
          <div class="subtle" style="margin-top:10px" id="homeHint"></div>
        </div>

        <div class="promo">
          <div class="blob" aria-hidden="true"></div>
          <h3 id="promoTitle"></h3>
          <p id="promoText"></p>
          <button class="btn" type="button" onclick="goTaxi()" id="promoBtn"></button>
        </div>

        <div class="card">
          <div class="list">
            <div class="row" onclick="openFavorites()">
              <div class="left">
                <!-- star -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2l3 7 7 .6-5.2 4.5 1.6 7-6.4-4-6.4 4 1.6-7L2 9.6 9 9l3-7Z"></path>
                </svg>
              </div>
              <div class="mid">
                <div class="t" id="favTitle"></div>
                <div class="d" id="favDesc"></div>
              </div>
              <div class="chev">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 18l6-6-6-6"></path>
                </svg>
              </div>
            </div>

            <div class="row" onclick="goTaxi()">
              <div class="left">
                <!-- route -->

    function applyTheme(){
      const t = getTheme();
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const dark = (t === 'dark') || (t === 'auto' && prefersDark);

      if(dark){
        document.documentElement.style.setProperty('--bg', '#0f1111');
        document.documentElement.style.setProperty('--card', '#151818');
        document.documentElement.style.setProperty('--text', '#f2f4f4');
        document.documentElement.style.setProperty('--muted', 'rgba(255,255,255,.62)');
        document.documentElement.style.setProperty('--border', 'rgba(255,255,255,.10)');
        document.documentElement.style.setProperty('--shadow', '0 16px 40px rgba(0,0,0,.40)');
      }else{
        document.documentElement.style.setProperty('--bg', '#f6f6f6');
        document.documentElement.style.setProperty('--card', '#ffffff');
        document.documentElement.style.setProperty('--text', '#111');
        document.documentElement.style.setProperty('--muted', 'rgba(0,0,0,.60)');
        document.documentElement.style.setProperty('--border', 'rgba(0,0,0,.10)');
        document.documentElement.style.setProperty('--shadow', '0 12px 26px rgba(0,0,0,.10)');
      }

      // update theme radios
      setActiveRadio('themeLight', t === 'light');
      setActiveRadio('themeDark',  t === 'dark');
      setActiveRadio('themeAuto',  t === 'auto');
    }

    function setTheme(val){
      localStorage.setItem(LS.theme, val);
      applyTheme();

    function setActiveRadio(id, on){
      const el = document.getElementById(id);
      if(!el) return;
      el.classList.toggle('active', !!on);
    }

    // ===== Pages
    function showPage(which){
      document.getElementById('pageHome').classList.toggle('hidden', which !== 'home');
      document.getElementById('pageRides').classList.toggle('hidden', which !== 'rides');
      document.getElementById('pageAccount').classList.toggle('hidden', which !== 'account');

      document.getElementById('tabHome').classList.toggle('active', which === 'home');
      document.getElementById('tabRides').classList.toggle('active', which === 'rides');
      document.getElementById('tabAccount').classList.toggle('active', which === 'account');

      if(which === 'rides') refreshRidesUI();
      if(which === 'account') refreshProfileUI();
      window.scrollTo({top:0, behavior:'smooth'});
    }

    // ===== Sheets
    function openSheet(id){
      document.getElementById('overlay').classList.add('show');
      const s = document.getElementById(id);
      if(!s) return;
      s.classList.add('open');
      s.setAttribute('aria-hidden','false');
    }
    function closeSheet(id){
      const s = document.getElementById(id);
      if(!s) return;
      s.classList.remove('open');
      s.setAttribute('aria-hidden','true');

      // close overlay if no sheet open
      setTimeout(() => {
        const anyOpen = document.querySelector('.sheet.open');
        if(!anyOpen) document.getElementById('overlay').classList.remove('show');
      }, 30);
    }
    function closeAllSheets(){
      document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
      document.getElementById('overlay').classList.remove('show');
      document.querySelectorAll('.sheet').forEach(s => s.setAttribute('aria-hidden','true'));
    }

    // ===== Profile (local "real")
    function getProfile(){
      const fallback = { name: "ymaanyGO klant", phone: "", email: "" };
      try{
        return Object.assign(fallback, JSON.parse(localStorage.getItem(LS.profile) || "{}"));
      }catch(e){
        return fallback;
      }
    }
    function saveProfileToLS(p){
      localStorage.setItem(LS.profile, JSON.stringify(p));
    }

    function refreshProfileUI(){
      const p = getProfile();
      document.getElementById('accName').textContent = p.name || "—";
      document.getElementById('accEmail').textContent = p.email || "—";

      document.getElementById('pName').value = p.name || "";
      document.getElementById('pPhone').value = p.phone || "";
      document.getElementById('pEmail').value = p.email || "";
    }

    function saveProfile(){
      const p = getProfile();
      p.name = (document.getElementById('pName').value || "").trim();
      p.phone = (document.getElementById('pPhone').value || "").trim();
      p.email = (document.getElementById('pEmail').value || "").trim();
      saveProfileToLS(p);
      refreshProfileUI();
      closeSheet('profileSheet');
    }

    function isStrongPw(p){
      return (p || "").length >= 8 && /[A-Z]/.test(p) && /[a-z]/.test(p) && /\d/.test(p);
    }

    function changePassword(){
      const lang = getLang();
      const T = i18n[lang] || i18n.nl;

      const a = (document.getElementById('newPw').value || "").trim();
      const b = (document.getElementById('newPw2').value || "").trim();

      if(!isStrongPw(a)){
        alert(T.pwNote);
        return;
      }
      if(a !== b){
        alert(lang === 'ar' ? "كلمتا المرور غير متطابقتين." : (lang === 'en' ? "Passwords do not match." : "Wachtwoorden komen niet overeen."));
        return;
      }

      localStorage.setItem(LS.pw, a);
      document.getElementById('newPw').value = "";
      document.getElementById('newPw2').value = "";
      closeSheet('securitySheet');
    }

      return localStorage.getItem(LS.payment) || 'card';
    }

      localStorage.setItem(LS.payment, v);
      refreshPaymentUI();
    }
    function refreshPaymentUI(){
      const v = getPayment();
      setActiveRadio('payCash', v === 'cash');
      setActiveRadio('payCard', v === 'card');
    }

    // ===== Favorites (CRUD)
    function getFavs(){
      try{
        const arr = JSON.parse(localStorage.getItem(LS.favs) || "[]");
        return Array.isArray(arr) ? arr : [];
      }catch(e){
        return [];
      }
    }
    function setFavs(arr){
      localStorage.setItem(LS.favs, JSON.stringify(arr));
    }

    function addFavorite(){
      const lang = getLang();
      const name = (document.getElementById('favName').value || "").trim();
      const addr = (document.getElementById('favAddr').value || "").trim();

      if(!name || !addr){
        alert(lang === 'ar' ? "اكتب الاسم والعنوان." : (lang === 'en' ? "Enter name and address." : "Vul naam en adres in."));
        return;
      }

      const favs = getFavs();
      favs.unshift({ id: cryptoRandom(), name, addr, createdAt: new Date().toISOString() });
      setFavs(favs);

      document.getElementById('favName').value = "";
      document.getElementById('favAddr').value = "";

      refreshFavoritesUI();
    }

    function removeFav(id){
      const favs = getFavs().filter(x => x.id !== id);
      setFavs(favs);
      refreshFavoritesUI();
    }

    function openFavorites(){
      refreshFavoritesUI();
      openSheet('favSheet');
    }

function tx_pad2(n){ return String(n).padStart(2,'0'); }
function tx_toLocalValue(d){
  return d.getFullYear()+"-"+tx_pad2(d.getMonth()+1)+"-"+tx_pad2(d.getDate())+"T"+tx_pad2(d.getHours())+":"+tx_pad2(d.getMinutes());
}
function tx_parseLocal(v){
  if(!v) return null;
  const d = new Date(v);

function tx_isPastPickup(v, buffer=15){
  const d = tx_parseLocal(v);

  const now = new Date();
  now.setMinutes(now.getMinutes()+buffer);
  return d.getTime() < now.getTime();
}

/* Geocode / reverse */
async function tx_geocode(q){
  const url = tx.NOMINATIM + "/search?format=json&limit=1&countrycodes=nl&addressdetails=1&q=" + encodeURIComponent(q);
  const res = await fetch(url, { headers: { "Accept":"application/json" }});
  const data = await res.json();
  if(!data?.[0]) return null;
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
}
async function tx_reverse(lat, lon){
  const url = tx.NOMINATIM + `/reverse?format=json&zoom=18&lat=${lat}&lon=${lon}&addressdetails=1`;
  const res = await fetch(url, { headers: { "Accept":"application/json" }});
  const data = await res.json();
  const a = data?.address || {};
  const road = a.road || a.pedestrian || "";
  const house = a.house_number || "";
  const city = a.city || a.town || a.village || "";
  const postcode = a.postcode || "";
  if(!road || !city) return null;
  const line = `${road} ${house}`.trim();
  return `${line}, ${postcode ? postcode+" " : ""}${city}, Nederland`.replace(/\s+/g,' ').trim();
}
async function tx_routeKm(A,B){
  const url = `${tx.OSRM}/route/v1/driving/${A.lon},${A.lat};${B.lon},${B.lat}?overview=false`;
  const res = await fetch(url, { headers: { "Accept":"application/json" }});
  const data = await res.json();
  if(data?.code !== "Ok" || !data?.routes?.[0]) return null;
  return { km: data.routes[0].distance/1000, min: data.routes[0].duration/60 };
}

/* Autocomplete */
function tx_debounce(fn, ms){
  let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
}
async function tx_suggest(q){
  const url = tx.NOMINATIM + "/search?format=json&limit=6&countrycodes=nl&addressdetails=1&q=" + encodeURIComponent(q);
  const res = await fetch(url, { headers: { "Accept":"application/json" }});
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}
function tx_formatSug(it){
  const a = it.address || {};
  const road = a.road || a.pedestrian || a.footway || "";
  const house = a.house_number || "";
  const city = a.city || a.town || a.village || "";
  const postcode = a.postcode || "";
  const line1 = `${road} ${house}`.trim() || (it.display_name||"").split(",")[0];
  const line2 = `${postcode ? postcode+" " : ""}${city}`.trim();
  return { line1, line2 };
}
function tx_setInput(fieldId, it){
  const a = it.address || {};
  const road = a.road || a.pedestrian || a.footway || "";
  const house = a.house_number || "";
  const city = a.city || a.town || a.village || "";
  const postcode = a.postcode || "";
  const line = `${(road+" "+house).trim()}, ${postcode ? postcode+" " : ""}${city}, Nederland`.replace(/\s+/g," ").trim();
  document.getElementById(fieldId).value = line || it.display_name || "";
}
function tx_hideSuggest(fieldId){
  const box = document.getElementById(fieldId === "txFrom" ? "txFromSuggest" : "txToSuggest");
  box.classList.add("hidden"); box.innerHTML="";
}
function tx_showSuggest(fieldId, items){
  const box = document.getElementById(fieldId === "txFrom" ? "txFromSuggest" : "txToSuggest");
  if(!items.length){ tx_hideSuggest(fieldId); return; }
  box.innerHTML = items.map((it, i)=>{
    const t = tx_formatSug(it);
    const line2 = t.line2 ? `<div class="tx-muted">${t.line2}</div>` : "";
    return `<div class="tx-item" data-i="${i}">
      <div>${t.line1}</div>${line2}
    </div>`;
  }).join("");
  box.classList.remove("hidden");
  box.querySelectorAll(".tx-item").forEach(el=>{
    el.addEventListener("mousedown",(e)=>e.preventDefault());
    el.addEventListener("click", ()=>{
      const it = items[Number(el.dataset.i)];
      tx_setInput(fieldId, it);
      tx_hideSuggest(fieldId);
      tx_autoCalc(true);
    });
  });
}
function tx_bind(fieldId){
  const input = document.getElementById(fieldId);
  const run = tx_debounce(async ()=>{
    const q = input.value.trim();
    if(q.length < 3){ tx_hideSuggest(fieldId); return; }
    const items = await tx_suggest(q);
    tx_showSuggest(fieldId, items);
  }, 250);

  input.addEventListener("input", ()=>{ run(); tx_autoCalc(); });
  input.addEventListener("blur", ()=>setTimeout(()=>tx_hideSuggest(fieldId),150));
  input.addEventListener("focus", ()=>{ if(input.value.trim().length>=3) run(); });
  input.addEventListener("keydown",(e)=>{ if(e.key==="Escape") tx_hideSuggest(fieldId); });
}

/* Map picker */
function tx_getPinLatLng(){
  const mapEl = document.getElementById('txMap');
  const pinEl = document.querySelector('.tx-pin');
  const mr = mapEl.getBoundingClientRect();
  const pr = pinEl.getBoundingClientRect();
  const x = (pr.left + pr.width/2) - mr.left;
  const y = (pr.top + pr.height) - mr.top;
  return tx.map.containerPointToLatLng([x,y]);
}
async function tx_openPicker(fieldId){
  tx.activeField = fieldId;

  document.getElementById("txModal").classList.add("open");

  setTimeout(async ()=>{
    if(!tx.map){
      tx.map = L.map('txMap', { zoomControl:false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' }).addTo(tx.map);
      tx.map.on('moveend', tx_onMoveEnd);
    }
    tx.map.invalidateSize(); setTimeout(()=>tx.map.invalidateSize(), 300);

    const val = document.getElementById(tx.activeField).value.trim();
    if(val){
      const p = await tx_geocode(val);

    }

    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(async (pos)=>{

        await tx_onMoveEnd();

        await tx_onMoveEnd();
      });

      tx.map.setView([52.3702, 4.8952], 14);
      await tx_onMoveEnd();
    }
  }, 60);

/* Auto-calc trigger */
function tx_autoCalc(force=false){
  clearTimeout(tx.autoTimer);
  tx.autoTimer = setTimeout(()=>tx_calc(force), force ? 50 : 450);

/* Main calc (auto) */
async function tx_calc(force=false){
  const van = document.getElementById("txFrom").value.trim();
  const naar = document.getElementById("txTo").value.trim();
  const voertuig = document.getElementById("txCar").value;
  const retour = document.getElementById("txRetour").checked;

  const tijd = document.getElementById("txTime").value;
  const retourTijd = document.getElementById("txRetourTime").value;

  // stops (non-empty only)
  const stopValues = (tx.stops || [])
    .map(id => (document.getElementById(id)?.value || "").trim())
    .filter(v => v.length > 0);

  if(!van || !naar || !tijd){
    document.getElementById("txPrice").textContent = "";
    document.getElementById("txMeta").textContent = "";
    return;
  }

  if(tx_isPastPickup(tijd, 15)){
    if(force) tx_showAlert("Kies een tijdstip minimaal 15 minuten vanaf nu.", "Ongeldige tijd");
    document.getElementById("txPrice").textContent = "";
    document.getElementById("txMeta").textContent = "";
    return;
  }

  if(retour){
    const td = tx_parseLocal(tijd);
    const rtd = tx_parseLocal(retourTijd);
    if(!rtd || rtd.getTime() <= td.getTime()){
      if(force) tx_showAlert("De retourtijd moet later zijn dan de vertrektijd.", "Ongeldige retourtijd");
      return;
    }
  }

  document.getElementById("txPrice").textContent = "Bezig...";
  document.getElementById("txMeta").textContent = "";

  // Build route: From -> stops -> To
  const addresses = [van, ...stopValues, naar];

  // Geocode all points
  const points = [];
  for(const addr of addresses){
    const p = await tx_geocode(addr);
    if(!p){
      if(force) tx_showAlert("Het adres is onduidelijk. Plaats de pin 📍 handmatig op de kaart.", "Adres probleem");
      document.getElementById("txPrice").textContent = "";
      return;
    }
    points.push(p);
  }

  // Route total (multi legs)
  const r = await tx_routeMulti(points);
  if(!r){
    if(force) tx_showAlert("De afstand kon niet worden berekend. Probeer opnieuw.", "Route probleem");
    document.getElementById("txPrice").textContent = "";
    return;
  }

  const perKm = (voertuig === "Busje") ? tx.PER_KM_VAN : tx.PER_KM_STD;

  let prijs = tx.START + (r.km * perKm);
  if(voertuig === "Comfort") prijs += tx.COMFORT;
  if(retour) prijs *= 2;

  document.getElementById("txPrice").textContent = "€ " + prijs.toFixed(2);
  document.getElementById("txMeta").textContent =
    `Afstand: ${r.km.toFixed(1)} km • Duur: ${Math.round(r.min)} min`;
}

/* Route open */
async function tx_openRoute(){
  const origin = document.getElementById("txFrom").value.trim();
  const destination = document.getElementById("txTo").value.trim();

  const stopValues = (tx.stops || [])
    .map(id => (document.getElementById(id)?.value || "").trim())
    .filter(v => v.length > 0);

  if(!origin || !destination){
    tx_showAlert("Vul Ophaallocatie en Bestemming in.", "Ontbrekende gegevens");
    return;
  }

  const isApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);

  if(isApple){
    // Apple Maps: only origin+dest reliably. (Waypoints support is inconsistent)
    window.open(
      "https://maps.apple.com/?saddr="+encodeURIComponent(origin)+
      "&daddr="+encodeURIComponent(destination)+
      "&dirflg=d",
      "_blank"
    );
  }else{
    // Google Maps supports waypoints
    const wp = stopValues.length
      ? "&waypoints=" + encodeURIComponent(stopValues.join("|"))
      : "";
    window.open(
      "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(origin)+
      "&destination="+encodeURIComponent(destination)+
      wp +
      "&travelmode=driving",
      "_blank"
    );
  }
}

/* Pax rule: lock Busje if >4 */
function tx_bindPaxRule(){
  const pax = document.getElementById("txPax");
  const car = document.getElementById("txCar");
  pax.addEventListener("change", ()=>{
    const n = parseInt(pax.value,10);
    if(n > 4){ car.value="Busje"; car.disabled=true; }
    else { car.disabled=false; }
    tx_autoCalc(true);
  });
}
// ✅ Stops state (keep max = 3)
tx.stops = [];      // array of stop input ids
tx.stopMax = 3;     // max tussenstops

function tx_addStop(){
  // ✅ limit stops
  if(tx.stops.length >= tx.stopMax){
    tx_showAlert(`Maximaal ${tx.stopMax} tussenstops toegestaan.`, "Tussenstop");
    return;
  }

  const idx = tx.stops.length + 1;
  const id = "txStop" + idx;
  tx.stops.push(id);

  const wrap = document.getElementById("txStops");
  if(!wrap){
    tx_showAlert("Element #txStops ontbreekt in de HTML.", "Tussenstop");
    return;
  }

  const row = document.createElement("div");
  row.className = "tx-stop-row";
  row.id = id + "Row";

  row.innerHTML = `
    <div class="tx-stop-tag"></div>
    <div class="tx-field">
      <span class="tx-glass"></span>
      <div class="tx-suggest-wrap">
        <input id="${id}" type="text" placeholder="Tussenstop ${idx}" autocomplete="off">
        <div id="${id}Suggest" class="tx-suggest hidden"></div>
      </div>
      <button class="tx-icon" type="button" onclick="tx_openPicker('${id}')">📍</button>
    </div>
    <button class="tx-remove" type="button" title="Verwijderen" onclick="tx_removeStop('${id}')">✕</button>
  `;
  wrap.appendChild(row);

  // ✅ bind autocomplete for this stop
  tx_bindDynamicStop(id);

  // ✅ auto calc after adding
  tx_autoCalc(true);
}

function tx_removeStop(id){
  const i = tx.stops.indexOf(id);
  if(i >= 0) tx.stops.splice(i, 1);

  // ✅ hide & clear suggestions dropdown for this stop (prevents orphan dropdown)
  tx_hideSuggestDynamic(id + "Suggest");

  const row = document.getElementById(id + "Row");
  if(row) row.remove();

  tx_autoCalc(true);
}

function tx_hideSuggestDynamic(suggestId){
  const box = document.getElementById(suggestId);
  if(!box) return;
  box.classList.add("hidden");
  box.innerHTML = "";
}

function tx_showSuggestDynamic(inputId, suggestId, items){
  const box = document.getElementById(suggestId);
  if(!box) return;

  if(!items.length){
    tx_hideSuggestDynamic(suggestId);
    return;
  }

  box.innerHTML = items.map((it, i)=>{
    const t = tx_formatSug(it);
    const line2 = t.line2 ? `<div class="tx-muted">${t.line2}</div>` : "";
    return `<div class="tx-item" data-i="${i}">
      <div>${t.line1}</div>${line2}
    </div>`;
  }).join("");

  box.classList.remove("hidden");

  box.querySelectorAll(".tx-item").forEach(el=>{
    el.addEventListener("mousedown", (e)=>e.preventDefault());
    el.addEventListener("click", ()=>{
      const it = items[Number(el.dataset.i)];
      tx_setInput(inputId, it);
      tx_hideSuggestDynamic(suggestId);
      tx_autoCalc(true);
    });
  });
}

function tx_bindDynamicStop(id){
  const input = document.getElementById(id);
  const suggestId = id + "Suggest";
  if(!input) return;

  const run = tx_debounce(async ()=>{
    const q = input.value.trim();
    if(q.length < 3){
      tx_hideSuggestDynamic(suggestId);
      return;
    }
    const items = await tx_suggest(q);
    tx_showSuggestDynamic(id, suggestId, items);
  }, 250);

  input.addEventListener("input", ()=>{ run(); tx_autoCalc(); });
  input.addEventListener("blur", ()=>setTimeout(()=>tx_hideSuggestDynamic(suggestId), 150));
  input.addEventListener("focus", ()=>{ if(input.value.trim().length >= 3) run(); });
  input.addEventListener("keydown", (e)=>{ if(e.key === "Escape") tx_hideSuggestDynamic(suggestId); });
}

// route for multi points: From -> stops -> To
async function tx_routeMulti(points){
  let totalKm = 0;
  let totalMin = 0;

  for(let i = 0; i < points.length - 1; i++){
    const r = await tx_routeKm(points[i], points[i+1]);
    if(!r) return null;
    totalKm += r.km;
    totalMin += r.min;
  }
  return { km: totalKm, min: totalMin };
}
