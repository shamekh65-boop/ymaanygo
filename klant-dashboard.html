<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7d32" />
  <title>ymaanyGO – Klant Dashboard</title>
  <link rel="icon" href="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico">

  <style>
    :root{
      --bg:#f6f6f6;
      --card:#ffffff;
      --text:#111;
      --muted:rgba(0,0,0,.60);
      --border:rgba(0,0,0,.10);
      --shadow:0 12px 26px rgba(0,0,0,.10);
      --radius:18px;

      /* Brand */
      --accent:#2f7d32;
      --accent2:#3bbf6b;

      /* Controls */
      --control-h:52px;
      --control-radius:18px;

      /* Bottom nav */
      --nav-h:72px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
    }

    a{color:inherit;text-decoration:none}
    button{font-family:inherit}
    .hidden{display:none !important}

    /* ===== App shell ===== */
    .wrap{max-width:820px;margin:0 auto;padding:0 14px;}
    .top{
      position:sticky; top:0; z-index:50;
      background:rgba(246,246,246,.85);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border-bottom:1px solid var(--border);
    }
    .top-inner{
      max-width:820px;margin:0 auto;
      padding:10px 14px;
      display:flex;align-items:center;gap:10px;
    }

    .logo{
      height:34px;
      width:auto;
      display:block;
      object-fit:contain;
    }

    .pill{
      margin-left:auto;
      display:flex;align-items:center;gap:10px;
    }

    .icon-btn{
      width:44px;height:44px;
      border-radius:16px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:0 10px 18px rgba(0,0,0,.08);
      cursor:pointer;
      display:grid;place-items:center;
    }
    .icon-btn:active{transform:translateY(1px)}

    .page{
      padding:14px 0 18px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .card.pad{padding:14px}
    .section-title{
      font-weight:900;
      font-size:18px;
      margin:6px 0 10px;
    }
    .subtle{color:var(--muted);font-size:13px}

    /* ===== Profile header (Account) ===== */
    .profile{
      text-align:center;
      padding:16px 14px 10px;
      background:linear-gradient(180deg, rgba(59,191,107,.10), rgba(255,255,255,0));
    }
    .avatar{
      width:82px;height:82px;border-radius:999px;
      background:rgba(0,0,0,.06);
      margin:4px auto 10px;
      display:grid;place-items:center;
      position:relative;
    }
    .avatar svg{opacity:.75}
    .name{font-weight:900;font-size:18px;margin:0}
    .email{margin:4px 0 0;color:var(--muted);font-size:13px}

    /* ===== List rows ===== */
    .list{display:flex;flex-direction:column}
    .row{
      display:flex;align-items:center;gap:12px;
      padding:14px;
      border-top:1px solid rgba(0,0,0,.06);
      background:#fff;
      cursor:pointer;
    }
    .row:first-child{border-top:0}
    .row:hover{background:rgba(0,0,0,.015)}
    .row .left{
      width:40px;height:40px;border-radius:14px;
      border:1px solid rgba(47,125,50,.22);
      background:rgba(59,191,107,.10);
      display:grid;place-items:center;
      flex:0 0 40px;
    }
    .row .mid{flex:1;min-width:0}
    .row .t{font-weight:900}
    .row .d{font-size:13px;color:var(--muted);margin-top:2px}
    .row .chev{opacity:.55}

    /* ===== Search bar (Home) ===== */
    .search{
      display:flex;align-items:center;gap:10px;
      height:var(--control-h);
      border-radius:999px;
      border:1px solid rgba(0,0,0,.10);
      background:rgba(255,255,255,.92);
      box-shadow:0 10px 18px rgba(0,0,0,.08);
      padding:0 14px;
    }
    .search input{
      border:0;outline:0;background:transparent;
      width:100%;
      font-size:16px;
    }

    .hero{
      display:grid;gap:12px;
    }

    .promo{
      border-radius:22px;
      padding:16px;
      background:linear-gradient(135deg, rgba(47,125,50,.95), rgba(59,191,107,.80));
      color:#fff;
      box-shadow:0 20px 34px rgba(0,0,0,.16);
      position:relative;
      overflow:hidden;
    }
    .promo h3{margin:0 0 6px;font-size:20px}
    .promo p{margin:0;opacity:.92}
    .promo .btn{
      margin-top:12px;
      width:fit-content;
      border:0;
      background:rgba(255,255,255,.92);
      color:#111;
      font-weight:900;
      padding:12px 16px;
      border-radius:14px;
      cursor:pointer;
    }
    .promo .blob{
      position:absolute;right:-40px;top:-40px;
      width:160px;height:160px;border-radius:999px;
      background:rgba(255,255,255,.14);
      filter: blur(0px);
    }

    /* ===== Rides empty ===== */
    .empty{
      text-align:center;
      padding:28px 14px;
    }
    .empty .ic{
      width:64px;height:64px;border-radius:999px;
      background:rgba(59,191,107,.12);
      border:1px solid rgba(47,125,50,.20);
      margin:0 auto 12px;
      display:grid;place-items:center;
    }
    .empty h2{margin:0 0 6px;font-size:22px}
    .empty p{margin:0;color:var(--muted)}
    .primary{
      margin-top:14px;
      width:100%;
      height:56px;
      border:0;
      border-radius:28px;
      background:linear-gradient(180deg, var(--accent2), var(--accent));
      color:#fff;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      box-shadow:0 14px 26px rgba(0,0,0,.16);
    }
    .primary:active{transform:translateY(1px) scale(.99)}

    /* ===== Tabs (Rides) ===== */
    .seg{
      display:flex; gap:10px;
      background:rgba(0,0,0,.05);
      border:1px solid rgba(0,0,0,.06);
      border-radius:999px;
      padding:8px;
      overflow:hidden;
    }
    .seg button{
      flex:1;
      height:44px;
      border-radius:999px;
      border:0;
      cursor:pointer;
      font-weight:900;
      background:transparent;
      color:rgba(0,0,0,.55);
    }
    .seg button.active{
      background:#fff;
      color:#111;
      box-shadow:0 10px 16px rgba(0,0,0,.10);
    }

    /* ===== Bottom Nav ===== */
    .bottom{
      position:fixed; left:0; right:0; bottom:0;
      height:calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding-bottom:env(safe-area-inset-bottom);
      background:rgba(255,255,255,.92);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border-top:1px solid var(--border);
      z-index:90;
    }
    .bottom-inner{
      max-width:820px;margin:0 auto;
      height:var(--nav-h);
      display:flex;align-items:center;justify-content:space-around;
      padding:8px 10px;
    }
    .tab{
      width:110px;
      display:flex;flex-direction:column;align-items:center;gap:6px;
      border:0;background:transparent;cursor:pointer;
      color:rgba(0,0,0,.45);
      font-weight:900;
      padding:8px 10px;border-radius:16px;
    }
    .tab svg{opacity:.6}
    .tab.active{
      color:var(--accent);
    }
    .tab.active svg{opacity:1}
    .tab:active{transform:translateY(1px)}

    /* ===== Sheets (Bottom modals) ===== */
    .overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,.30);
      z-index:120;
      display:none;
    }
    .overlay.show{display:block}
    .sheet{
      position:fixed; left:0; right:0; bottom:-110%;
      z-index:121;
      transition:bottom .22s ease;
      padding:10px 10px calc(14px + env(safe-area-inset-bottom));
    }
    .sheet.open{bottom:0}
    .sheet-card{
      max-width:820px;margin:0 auto;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(0,0,0,.08);
      border-radius:22px;
      box-shadow:0 30px 80px rgba(0,0,0,.22);
      overflow:hidden;
    }
    .sheet-grip{
      width:48px;height:5px;border-radius:999px;
      background:rgba(0,0,0,.18);
      margin:10px auto 0;
    }
    .sheet-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px;
      border-bottom:1px solid rgba(0,0,0,.06);
    }
    .sheet-title{font-weight:900;font-size:18px}
    .sheet-x{
      width:42px;height:42px;border-radius:16px;
      border:1px solid rgba(0,0,0,.10);
      background:#fff;
      cursor:pointer;
      font-size:20px; line-height:1;
    }
    .sheet-body{padding:12px 14px}
    .sheet-actions{padding:12px 14px; border-top:1px solid rgba(0,0,0,.06)}
    .btn-ghost{
      width:100%;
      height:52px;border-radius:18px;
      border:1px solid rgba(0,0,0,.12);
      background:#fff;
      font-weight:900;
      cursor:pointer;
    }

    /* ===== Forms in sheets ===== */
    .field{
      display:grid; gap:8px;
      margin:10px 0;
    }
    .field label{font-size:13px;font-weight:900;color:rgba(0,0,0,.75)}
    .field input{
      height:48px;
      border-radius:16px;
      border:1px solid rgba(0,0,0,.14);
      padding:0 12px;
      font-size:16px;
      outline:none;
      background:#fff;
    }
    .field input:focus{border-color:#111}

    .radio-row{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 2px;
      border-top:1px solid rgba(0,0,0,.06);
      cursor:pointer;
    }
    .radio-row:first-child{border-top:0}
    .radio-row .l{display:flex;align-items:center;gap:10px}
    .dot{
      width:20px;height:20px;border-radius:999px;
      border:2px solid rgba(0,0,0,.25);
      display:grid;place-items:center;
    }
    .dot i{
      width:10px;height:10px;border-radius:999px;
      background:var(--accent);
      display:none;
    }
    .radio-row.active .dot{border-color:var(--accent)}
    .radio-row.active .dot i{display:block}

    /* ===== RTL (Arabic) ===== */
    body[dir="rtl"] .top-inner{flex-direction:row-reverse}
    body[dir="rtl"] .pill{margin-left:0;margin-right:auto}
    body[dir="rtl"] .row{flex-direction:row-reverse}
    body[dir="rtl"] .row .mid{text-align:right}
    body[dir="rtl"] .sheet-head{flex-direction:row-reverse}
    body[dir="rtl"] .radio-row{flex-direction:row-reverse}
    body[dir="rtl"] .radio-row .l{flex-direction:row-reverse}
  </style>
</head>

<body>

  <!-- Top -->
  <div class="top">
    <div class="top-inner">
      <img class="logo" src="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/logo.png" alt="ymaanyGO"
           onerror="this.src='https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/logo.jpeg'">

      <div class="pill">
        <button class="icon-btn" type="button" aria-label="Language" onclick="openSheet('langSheet')">
          <!-- globe -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M2 12h20"></path>
            <path d="M12 2a15 15 0 0 1 0 20"></path>
            <path d="M12 2a15 15 0 0 0 0 20"></path>
          </svg>
        </button>

        <button class="icon-btn" type="button" aria-label="Theme" onclick="openSheet('themeSheet')">
          <!-- sun/moon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Pages -->
  <div class="wrap">
    <!-- HOME -->
    <section id="pageHome" class="page">
      <div class="hero">
        <div class="card pad">
          <div class="search" onclick="goTaxi()">
            <!-- search icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.75">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M21 21l-4.3-4.3"></path>
            </svg>
            <input id="homeSearch" type="text" readonly value="" />
          </div>
          <div class="subtle" style="margin-top:10px" id="homeHint"></div>
        </div>

        <div class="promo">
          <div class="blob" aria-hidden="true"></div>
          <h3 id="promoTitle"></h3>
          <p id="promoText"></p>
          <button class="btn" type="button" onclick="goTaxi()" id="promoBtn"></button>
        </div>

        <div class="card">
          <div class="list">
            <div class="row" onclick="openFavorites()">
              <div class="left">
                <!-- star -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2l3 7 7 .6-5.2 4.5 1.6 7-6.4-4-6.4 4 1.6-7L2 9.6 9 9l3-7Z"></path>
                </svg>
              </div>
              <div class="mid">
                <div class="t" id="favTitle"></div>
                <div class="d" id="favDesc"></div>
              </div>
              <div class="chev">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 18l6-6-6-6"></path>
                </svg>
              </div>
            </div>

            <div class="row" onclick="goTaxi()">
              <div class="left">
                <!-- route -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 6a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"></path>
                  <path d="M18 18a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"></path>
                  <path d="M8 6h4a4 4 0 0 1 4 4v4"></path>
                </svg>
              </div>
              <div class="mid">
                <div class="t" id="quickBookTitle"></div>
                <div class="d" id="quickBookDesc"></div>
              </div>
              <div class="chev">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 18l6-6-6-6"></path>
                </svg>
              </div>
            </div>

          </div>
        </div>
      </div>
    </section>

    <!-- RIDES -->
    <section id="pageRides" class="page hidden">
      <div class="card pad" style="margin-bottom:12px;">
        <div class="seg" role="tablist" aria-label="Ritten tabs">
          <button id="segUpcoming" class="active" type="button" onclick="setRidesTab('upcoming')"></button>
          <button id="segPast" type="button" onclick="setRidesTab('past')"></button>
        </div>
      </div>

      <div class="card">
        <div id="ridesList" class="hidden"></div>

        <div id="ridesEmpty" class="empty">
          <div class="ic">
            <!-- calendar -->
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.75">
              <rect x="3" y="4" width="18" height="18" rx="3"></rect>
              <path d="M16 2v4M8 2v4M3 10h18"></path>
            </svg>
          </div>
          <h2 id="ridesEmptyTitle"></h2>
          <p id="ridesEmptyText"></p>
          <button class="primary" type="button" onclick="goTaxi()" id="ridesEmptyBtn"></button>
        </div>
      </div>
    </section>

    <!-- ACCOUNT -->
    <section id="pageAccount" class="page hidden">
      <div class="card">
        <div class="profile">
          <div class="avatar">
            <!-- user -->
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="8" r="4"></circle>
            </svg>
          </div>
          <p class="name" id="accName"></p>
          <p class="email" id="accEmail"></p>
        </div>

        <div class="list">
          <div class="row" onclick="openSheet('profileSheet')">
            <div class="left">
              <!-- user -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21a8 8 0 0 0-16 0"></path>
                <circle cx="12" cy="8" r="4"></circle>
              </svg>
            </div>
            <div class="mid">
              <div class="t" id="miProfile"></div>
              <div class="d" id="miProfileDesc"></div>
            </div>
            <div class="chev">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"></path>
              </svg>
            </div>
          </div>

          <div class="row" onclick="openSheet('securitySheet')">
            <div class="left">
              <!-- lock -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
              </svg>
            </div>
            <div class="mid">
              <div class="t" id="miSecurity"></div>
              <div class="d" id="miSecurityDesc"></div>
            </div>
            <div class="chev">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"></path>
              </svg>
            </div>
          </div>

          <div class="row" onclick="openSheet('paymentSheet')">
            <div class="left">
              <!-- wallet -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"></path>
                <path d="M16 13h6"></path>
                <path d="M6 7V5a2 2 0 0 1 2-2h10"></path>
              </svg>
            </div>
            <div class="mid">
              <div class="t" id="miPayment"></div>
              <div class="d" id="miPaymentDesc"></div>
            </div>
            <div class="chev">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"></path>
              </svg>
            </div>
          </div>

          <div class="row" onclick="openFavorites()">
            <div class="left">
              <!-- pin -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21s7-4.4 7-11a7 7 0 0 0-14 0c0 6.6 7 11 7 11Z"></path>
                <circle cx="12" cy="10" r="2"></circle>
              </svg>
            </div>
            <div class="mid">
              <div class="t" id="miFav"></div>
              <div class="d" id="miFavDesc"></div>
            </div>
            <div class="chev">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"></path>
              </svg>
            </div>
          </div>

          <div class="row" onclick="openSheet('supportSheet')">
            <div class="left">
              <!-- headset -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12a8 8 0 0 1 16 0"></path>
                <path d="M4 12v5a2 2 0 0 0 2 2h2"></path>
                <path d="M20 12v5a2 2 0 0 1-2 2h-2"></path>
                <path d="M8 19a4 4 0 0 0 8 0"></path>
              </svg>
            </div>
            <div class="mid">
              <div class="t" id="miSupport"></div>
              <div class="d" id="miSupportDesc"></div>
            </div>
            <div class="chev">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="card pad">
        <div class="section-title" id="otherTitle"></div>
        <div class="list" style="border-top:1px solid rgba(0,0,0,.06)">
          <div class="row" onclick="openSheet('langSheet')">
            <div class="left">
              <!-- language -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 5h7"></path>
                <path d="M7 5v15"></path>
                <path d="M4 19h7"></path>
                <path d="M13 7h7"></path>
                <path d="M13 17h7"></path>
                <path d="M13 7c1.5 3.5 4 6 7 7"></path>
                <path d="M20 7c-1.5 3.5-4 6-7 7"></path>
              </svg>
            </div>
            <div class="mid">
              <div class="t" id="miLang"></div>
              <div class="d" id="miLangDesc"></div>
            </div>

    function getLang(){
      return localStorage.getItem(LS.lang) || 'nl';
    }
    function getTheme(){
      return localStorage.getItem(LS.theme) || 'auto';
    }

    function applyTheme(){
      const t = getTheme();
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const dark = (t === 'dark') || (t === 'auto' && prefersDark);

      if(dark){
        document.documentElement.style.setProperty('--bg', '#0f1111');
        document.documentElement.style.setProperty('--card', '#151818');
        document.documentElement.style.setProperty('--text', '#f2f4f4');
        document.documentElement.style.setProperty('--muted', 'rgba(255,255,255,.62)');
        document.documentElement.style.setProperty('--border', 'rgba(255,255,255,.10)');
        document.documentElement.style.setProperty('--shadow', '0 16px 40px rgba(0,0,0,.40)');
      }else{
        document.documentElement.style.setProperty('--bg', '#f6f6f6');
        document.documentElement.style.setProperty('--card', '#ffffff');
        document.documentElement.style.setProperty('--text', '#111');
        document.documentElement.style.setProperty('--muted', 'rgba(0,0,0,.60)');
        document.documentElement.style.setProperty('--border', 'rgba(0,0,0,.10)');
        document.documentElement.style.setProperty('--shadow', '0 12px 26px rgba(0,0,0,.10)');
      }

      // update theme radios
      setActiveRadio('themeLight', t === 'light');
      setActiveRadio('themeDark',  t === 'dark');
      setActiveRadio('themeAuto',  t === 'auto');
    }

    function setTheme(val){
      localStorage.setItem(LS.theme, val);
      applyTheme();
    }

    function applyLang(){
      const lang = getLang();
      const T = i18n[lang] || i18n.nl;

      document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;

      // Bottom tabs
      document.getElementById('tabHomeLbl').textContent = T.tabHome;
      document.getElementById('tabRidesLbl').textContent = T.tabRides;
      document.getElementById('tabAccountLbl').textContent = T.tabAccount;

      // Home
      document.getElementById('homeSearch').value = T.homeSearch;
      document.getElementById('homeHint').textContent = T.homeHint;

    function setLang(lang){
      localStorage.setItem(LS.lang, lang);
      applyLang();
    }

    function setActiveRadio(id, on){
      const el = document.getElementById(id);
      if(!el) return;
      el.classList.toggle('active', !!on);
    }

    // ===== Pages
    function showPage(which){
      document.getElementById('pageHome').classList.toggle('hidden', which !== 'home');
      document.getElementById('pageRides').classList.toggle('hidden', which !== 'rides');
      document.getElementById('pageAccount').classList.toggle('hidden', which !== 'account');

      document.getElementById('tabHome').classList.toggle('active', which === 'home');
      document.getElementById('tabRides').classList.toggle('active', which === 'rides');
      document.getElementById('tabAccount').classList.toggle('active', which === 'account');

      if(which === 'rides') refreshRidesUI();
      if(which === 'account') refreshProfileUI();
      window.scrollTo({top:0, behavior:'smooth'});
    }

    // ===== Sheets
    function openSheet(id){
      document.getElementById('overlay').classList.add('show');
      const s = document.getElementById(id);
      if(!s) return;
      s.classList.add('open');
      s.setAttribute('aria-hidden','false');
    }
    function closeSheet(id){
      const s = document.getElementById(id);
      if(!s) return;
      s.classList.remove('open');
      s.setAttribute('aria-hidden','true');

      // close overlay if no sheet open
      setTimeout(() => {
        const anyOpen = document.querySelector('.sheet.open');
        if(!anyOpen) document.getElementById('overlay').classList.remove('show');
      }, 30);
    }
    function closeAllSheets(){
      document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
      document.getElementById('overlay').classList.remove('show');
      document.querySelectorAll('.sheet').forEach(s => s.setAttribute('aria-hidden','true'));
    }

    // ===== Profile (local "real")
    function getProfile(){
      const fallback = { name: "ymaanyGO klant", phone: "", email: "" };
      try{
        return Object.assign(fallback, JSON.parse(localStorage.getItem(LS.profile) || "{}"));
      }catch(e){
        return fallback;
      }
    }
    function saveProfileToLS(p){
      localStorage.setItem(LS.profile, JSON.stringify(p));
    }

    function refreshProfileUI(){
      const p = getProfile();
      document.getElementById('accName').textContent = p.name || "—";
      document.getElementById('accEmail').textContent = p.email || "—";

      document.getElementById('pName').value = p.name || "";
      document.getElementById('pPhone').value = p.phone || "";
      document.getElementById('pEmail').value = p.email || "";
    }

    function saveProfile(){
      const p = getProfile();
      p.name = (document.getElementById('pName').value || "").trim();
      p.phone = (document.getElementById('pPhone').value || "").trim();
      p.email = (document.getElementById('pEmail').value || "").trim();
      saveProfileToLS(p);
      refreshProfileUI();
      closeSheet('profileSheet');
    }

    function isStrongPw(p){
      return (p || "").length >= 8 && /[A-Z]/.test(p) && /[a-z]/.test(p) && /\d/.test(p);
    }

    function changePassword(){
      const lang = getLang();
      const T = i18n[lang] || i18n.nl;

      const a = (document.getElementById('newPw').value || "").trim();
      const b = (document.getElementById('newPw2').value || "").trim();

      if(!isStrongPw(a)){
        alert(T.pwNote);
        return;
      }
      if(a !== b){
        alert(lang === 'ar' ? "كلمتا المرور غير متطابقتين." : (lang === 'en' ? "Passwords do not match." : "Wachtwoorden komen niet overeen."));
        return;
      }

      localStorage.setItem(LS.pw, a);
      document.getElementById('newPw').value = "";
      document.getElementById('newPw2').value = "";
      closeSheet('securitySheet');
    }

    // ===== Payment (pay driver)
    function getPayment(){
      return localStorage.getItem(LS.payment) || 'card';
    }
    function setPayment(v){
      localStorage.setItem(LS.payment, v);
      refreshPaymentUI();
    }
    function refreshPaymentUI(){
      const v = getPayment();
      setActiveRadio('payCash', v === 'cash');
      setActiveRadio('payCard', v === 'card');
    }

    // ===== Favorites (CRUD)
    function getFavs(){
      try{
        const arr = JSON.parse(localStorage.getItem(LS.favs) || "[]");
        return Array.isArray(arr) ? arr : [];
      }catch(e){
        return [];
      }
    }
    function setFavs(arr){
      localStorage.setItem(LS.favs, JSON.stringify(arr));
    }

    function addFavorite(){
      const lang = getLang();
      const name = (document.getElementById('favName').value || "").trim();
      const addr = (document.getElementById('favAddr').value || "").trim();

      if(!name || !addr){
        alert(lang === 'ar' ? "اكتب الاسم والعنوان." : (lang === 'en' ? "Enter name and address." : "Vul naam en adres in."));
        return;
      }

      const favs = getFavs();
      favs.unshift({ id: cryptoRandom(), name, addr, createdAt: new Date().toISOString() });
      setFavs(favs);

      document.getElementById('favName').value = "";
      document.getElementById('favAddr').value = "";

      refreshFavoritesUI();
    }

    function removeFav(id){
      const favs = getFavs().filter(x => x.id !== id);
      setFavs(favs);
      refreshFavoritesUI();
    }

    function openFavorites(){
      refreshFavoritesUI();
      openSheet('favSheet');
    }

    function refreshFavoritesUI(){
      const lang = getLang();
      const T = i18n[lang] || i18n.nl;

      const favs = getFavs();
      const list = document.getElementById('favList');

      if(!favs.length){
        list.innerHTML = `
          <div class="subtle" style="padding:6px 2px;">
            ${lang === 'ar' ? "لا يوجد مواقع مفضلة بعد." : (lang === 'en' ? "No favorites yet." : "Nog geen favorieten.")}
          </div>
        `;
      }else{
        list.innerHTML = favs.map(f => `
          <div class="row" style="border:1px solid rgba(0,0,0,.08);border-radius:18px;margin:10px 0;cursor:default;">
            <div class="left" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21s7-4.4 7-11a7 7 0 0 0-14 0c0 6.6 7 11 7 11Z"></path>
                <circle cx="12" cy="10" r="2"></circle>
              </svg>
            </div>
            <div class="mid">
              <div class="t">${escapeHtml(f.name)}</div>
              <div class="d">${escapeHtml(f.addr)}</div>
            </div>
            <button class="icon-btn" type="button" onclick="removeFav('${f.id}')"
                    aria-label="${lang === 'ar' ? "حذف" : (lang === 'en' ? "Delete" : "Verwijderen")}"
                    style="width:44px;height:44px;box-shadow:none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.85">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M19 6l-1 16H6L5 6"></path>
              </svg>
            </button>
          </div>
        `).join("");
      }

      // Home line refresh
      document.getElementById('favTitle').textContent = T.favTitle;
      document.getElementById('favDesc').textContent = T.favDesc;
    }

    // ===== Rides (placeholder local, real on device)
    let ridesTab = 'upcoming';
    function setRidesTab(t){
      ridesTab = t;
      document.getElementById('segUpcoming').classList.toggle('active', t === 'upcoming');
      document.getElementById('segPast').classList.toggle('active', t === 'past');
      refreshRidesUI();
    }

    function getRides(){
      try{
        const arr = JSON.parse(localStorage.getItem(LS.rides) || "[]");
        return Array.isArray(arr) ? arr : [];
      }catch(e){
        return [];
      }
    }

    function refreshRidesUI(){
      const lang = getLang();
      const T = i18n[lang] || i18n.nl;

      const rides = getRides();
      const now = Date.now();

      const filtered = rides.filter(r => {
        const ts = new Date(r.when).getTime();
        return ridesTab === 'upcoming' ? (ts >= now) : (ts < now);
      }).sort((a,b)=> new Date(a.when) - new Date(b.when));

      const empty = document.getElementById('ridesEmpty');
      const list = document.getElementById('ridesList');

      if(!filtered.length){
        list.classList.add('hidden');
        empty.classList.remove('hidden');
        document.getElementById('ridesEmptyTitle').textContent = T.ridesEmptyTitle;
        document.getElementById('ridesEmptyText').textContent = T.ridesEmptyText;
        document.getElementById('ridesEmptyBtn').textContent = T.ridesEmptyBtn;
        return;
      }

      empty.classList.add('hidden');
      list.classList.remove('hidden');

      list.innerHTML = `
        <div class="list">
          ${filtered.map(r => `
            <div class="row" style="cursor:default">
              <div class="left">
                <!-- ticket -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 9a2 2 0 0 1 2-2h14v4a2 2 0 0 0 0 4v4H6a2 2 0 0 1-2-2V9Z"></path>
                  <path d="M13 7v10"></path>
                </svg>
              </div>
              <div class="mid">
                <div class="t">${escapeHtml(r.from)} → ${escapeHtml(r.to)}</div>
                <div class="d">${formatWhen(r.when, lang)} • ${escapeHtml(r.vehicle || "")}</div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    // ===== Navigation actions
    function goTaxi(){
      // عدّل الرابط حسب مشروعك
      window.location.href = "taxi.html";
    }

    function openWhatsAppSupport(){
      // عدّل الرقم إذا تريد
      const whatsappNummer = "31633337184";
      const lang = getLang();
      const msg = (lang === 'ar')
        ? "مرحبا، أحتاج مساعدة في ymaanyGO."
        : (lang === 'en')
          ? "Hi, I need help with ymaanyGO."
          : "Hallo, ik heb hulp nodig met ymaanyGO.";
      window.open("https://wa.me/" + whatsappNummer + "?text=" + encodeURIComponent(msg), "_blank");
    }

    function logout(){
      // "حقيقي" على الجهاز: نمسح بيانات المستخدم المحلية (بدون حذف كل شيء إذا ما تريد)
      localStorage.removeItem(LS.profile);
      localStorage.removeItem(LS.pw);
      // اختياري: favs/rides
      // localStorage.removeItem(LS.favs);
      // localStorage.removeItem(LS.rides);

      refreshProfileUI();
      showPage('home');
      alert(getLang() === 'ar' ? "تم تسجيل الخروج." : (getLang()==='en' ? "Logged out." : "Uitgelogd."));
    }

    // ===== Utils
    function cryptoRandom(){
      // simple id without libs
      return 'id_' + Math.random().toString(16).slice(2) + Date.now().toString(16);
    }

    function escapeHtml(s){
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function formatWhen(iso, lang){
      const d = new Date(iso);
      if(isNaN(d.getTime())) return iso;
      const opts = { weekday:'short', year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' };
      try{
        return d.toLocaleString(lang === 'ar' ? 'ar' : (lang === 'en' ? 'en-US' : 'nl-NL'), opts);
      }catch(e){
        return d.toLocaleString();
      }
    }

    // ===== Init
    function ensureDefaults(){
      // profile default
      const p = getProfile();
      if(!localStorage.getItem(LS.profile)){
        // لو عندك ايميل/اسم مخزن سابقاً من تسجيل المستخدم المحلي ضع هنا
        saveProfileToLS(p);
      }
      // payment default
      if(!localStorage.getItem(LS.payment)) localStorage.setItem(LS.payment, 'card');
      // lang default
      if(!localStorage.getItem(LS.lang)) localStorage.setItem(LS.lang, 'nl');
      // theme default
      if(!localStorage.getItem(LS.theme)) localStorage.setItem(LS.theme, 'auto');
      // favs default empty
      if(!localStorage.getItem(LS.favs)) localStorage.setItem(LS.favs, '[]');
      // rides default empty
      if(!localStorage.getItem(LS.rides)) localStorage.setItem(LS.rides, '[]');
    }

    // Keyboard: ESC closes sheets
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') closeAllSheets();
    });

    // watch system theme if auto
    if(window.matchMedia){
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if(getTheme() === 'auto') applyTheme();
      });
    }

    // Run
    ensureDefaults();
    applyTheme();
    applyLang();
    refreshPaymentUI();
    setRidesTab('upcoming');
    showPage('home');
  </script>
