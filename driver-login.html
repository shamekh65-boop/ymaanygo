 <!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Inloggen chauffeurs – ymaanyGO</title>
  <meta name="description" content="Inlogpagina voor chauffeurs van ymaanyGO.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico">

  <style>
    :root{
      --bg-light:#f6fbf8;
      --bg-mid:#e6f3ed;
      --bg-dark:#d7ece2;
      --panel:rgba(255,255,255,.92);
      --text:#0b2e1f;
      --muted:#4f7f68;
      --line:rgba(0,0,0,.08);
      --accent:#2ecc71;
      --accent2:#27ae60;
      --radius:18px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      background: linear-gradient(
        to bottom,
        var(--bg-light) 0%,
        var(--bg-mid) 60%,
        var(--bg-dark) 100%
      );
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      line-height:1.5;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:0 18px;
      width:100%;
    }

    /* ----- NIEUWE HEADER STIJLEN (afkomstig van de hoofdpagina) ----- */
    header{
      background: linear-gradient(
        to bottom,
        rgba(245,248,246,.95),
        rgba(210,232,220,.92)
      );
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:10;
    }

    .header-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 0;
      gap:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color:var(--text);
    }

    .logo{
      width:46px;
      height:46px;
      border-radius:12px;
      background:#fff;
      padding:6px;
      border:1px solid var(--line);
      object-fit:contain;
    }

    .brand-name{
      display:flex;
      flex-direction:column;
      gap:1px;
    }
    .brand-name strong{ font-size:15px; }
    .brand-name span{ font-size:12.5px; color:var(--muted); }

    nav{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    nav a{
      color:var(--muted);
      text-decoration:none;
      font-size:14px;
      padding:8px 10px;
      border-radius:12px;
    }

    nav a:hover{
      background:rgba(46,204,113,.08);
      color:var(--text);
    }

    .btn{
      padding:10px 16px;
      border-radius:14px;
      font-weight:700;
      text-decoration:none;
      color:#fff;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      box-shadow:0 10px 22px rgba(46,204,113,.25);
      white-space:nowrap;
      display:inline-block;
    }

    /* ----- originele stijlen voor de login-card (ongewijzigd) ----- */
    main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:34px 0;
    }

    .login-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:30px 26px;
      box-shadow:0 20px 44px rgba(0,0,0,.09);
      width:100%;
      max-width:440px;
      margin:0 auto;
      position:relative;
      overflow:hidden;
    }

    .login-card::before{
      content:"";
      position:absolute;
      inset:-60px -60px auto auto;
      width:180px;
      height:180px;
      background: radial-gradient(circle, rgba(46,204,113,.20), transparent 60%);
      pointer-events:none;
    }

    .login-card h1{
      font-size:28px;
      margin-bottom:8px;
      color:var(--text);
      letter-spacing:-0.2px;
    }

    .login-card .sub{
      color:var(--muted);
      margin-bottom:18px;
      font-size:15px;
    }

    .trust{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:0 0 18px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background: rgba(46, 204, 113, .10);
      border: 1px solid rgba(46, 204, 113, .22);
      color: var(--text);
      font-size:13px;
      font-weight:600;
    }

    .msg{
      display:none;
      margin:10px 0 0;
      padding:12px 14px;
      border-radius:14px;
      font-size:14px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
    }
    .msg.err{
      border-color: rgba(231,76,60,.35);
      background: rgba(231,76,60,.08);
    }
    .msg.ok{
      border-color: rgba(46,204,113,.35);
      background: rgba(46,204,113,.08);
    }

    .input-group{
      margin-bottom:16px;
    }

    .input-group label{
      display:block;
      margin-bottom:6px;
      font-weight:600;
      font-size:13.5px;
      color:var(--text);
    }

    .input-wrap{
      position:relative;
    }

    .input-group input{
      width:100%;
      padding:12px 42px 12px 14px;
      border:1px solid var(--line);
      border-radius:14px;
      font-size:15px;
      background:white;
      transition:border 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(46,204,113,.18);
    }

    .toggle{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      cursor:pointer;
      padding:6px 8px;
      border-radius:10px;
      color:var(--muted);
      font-weight:800;
      font-size:12px;
    }

    .toggle:hover{
      background: rgba(46,204,113,.10);
      color: var(--text);
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:6px;
      flex-wrap:wrap;
    }

    .check{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--muted);
      font-size:14px;
      user-select:none;
    }

    .check input{
      width:18px;
      height:18px;
      accent-color: var(--accent2);
    }

    .login-btn{
      width:100%;
      padding:14px 20px;
      border:none;
      border-radius:14px;
      font-weight:800;
      font-size:16px;
      color:#fff;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      box-shadow:0 12px 26px rgba(46,204,113,.28);
      cursor:pointer;
      transition:transform 0.12s ease, opacity 0.2s ease;
      margin-top:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .login-btn:hover{ opacity:0.95; }
    .login-btn:active{ transform:translateY(1px); }

    .spinner{
      width:16px;
      height:16px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.45);
      border-top-color:#fff;
      display:none;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg);} }

    .forgot-link{
      display:inline-block;
      margin-top:14px;
      color:var(--muted);
      font-size:14px;
      text-decoration:none;
      border-bottom:1px dashed transparent;
      transition:border-color 0.2s, color 0.2s;
    }

    .forgot-link:hover{
      border-bottom-color:var(--accent);
      color:var(--text);
    }

    .hint{
      margin-top:12px;
      color:var(--muted);
      font-size:12.8px;
      line-height:1.45;
    }

    footer{
      text-align:center;
      padding:18px 0;
      color:var(--muted);
      font-size:13px;
      border-top:1px solid var(--line);
      background:rgba(255,255,255,.20);
    }

    footer a{
      color:var(--accent2);
      text-decoration:none;
    }

    footer a:hover{
      text-decoration:underline;
    }

    @media (max-width:480px){
      .login-card{ padding:24px 18px; }
    }
  </style>
</head>
<body>

<!-- HEADER VERVANGEN door de versie van de hoofdpagina (alleen de header) -->
<header>
  <div class="wrap">
    <div class="header-inner">
      <a class="brand" href="/">
        <img class="logo"
             src="https://raw.githubusercontent.com/shamekh65-boop/ymaanygo/main/favicon.ico"
             alt="ymaanyGO">
        <div class="brand-name">
          <strong>ymaanyGO</strong>
          <span>Taxi • Nederland • DE/BE luchthavens</span>
        </div>
      </a>
      <nav>
        <!-- Alleen de knop "Taxi boeken" is overgenomen, de lege ankerlinks zijn weggelaten voor een nettere header -->
        <a class="btn" href="https://ymaanygo.nl/taxi.html">Taxi boeken</a>
      </nav>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="login-card" aria-live="polite">
      <h1>Inloggen chauffeurs</h1>
      <p class="sub">Toegang tot het chauffeursportaal</p>

      <form id="loginForm" action="#" method="post" novalidate>
        <div class="input-group">
          <label for="username">Gebruikersnaam of e-mail</label>
          <div class="input-wrap">
            <input type="text" id="username" name="username" placeholder="" autocomplete="username" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Wachtwoord</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required minlength="4">
            <button class="toggle" type="button" id="togglePw" aria-label="Wachtwoord tonen/verbergen">TOON</button>
          </div>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="remember">
            Onthouden op dit apparaat
          </label>

          <a href="#" class="forgot-link" id="forgot">Wachtwoord vergeten?</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="spinner" id="spin"></span>
          <span id="btnText">Inloggen</span>
        </button>

        <div id="msgErr" class="msg err">Onjuiste gegevens. Controleer je invoer.</div>
        <div id="msgOk" class="msg ok">Succes! Doorsturen…</div>

      </form>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    &copy; 2026 ymaanyGO. <a href="/">Terug naar de website</a>
  </div>
</footer>

<script>
  // ===== Demo login (tijdelijke gebruikers) =====
  const USERS = {
    "driver01": "1111",
    "driver02": "2222",
    "chauffeur": "1234"
  };

  const form = document.getElementById('loginForm');
  const username = document.getElementById('username');
  const password = document.getElementById('password');
  const remember = document.getElementById('remember');

  const msgErr = document.getElementById('msgErr');
  const msgOk  = document.getElementById('msgOk');

  const togglePw = document.getElementById('togglePw');
  const btn = document.getElementById('loginBtn');
  const spin = document.getElementById('spin');
  const btnText = document.getElementById('btnText');

  function show(el){ el.style.display = 'block'; }
  function hide(el){ el.style.display = 'none'; }

  togglePw.addEventListener('click', () => {
    const isPw = password.type === 'password';
    password.type = isPw ? 'text' : 'password';
    togglePw.textContent = isPw ? 'VERBERG' : 'TOON';
  });

  const savedUser = localStorage.getItem('ymaanygo_driver_user');
  if (savedUser) {
    username.value = savedUser;
    remember.checked = true;
  }

  document.getElementById('forgot').addEventListener('click', (e) => {
    e.preventDefault();
    hide(msgOk);
    msgErr.textContent = "Neem contact op met de beheerder om je wachtwoord te resetten.";
    show(msgErr);
  });

  function setLoading(isLoading){
    btn.disabled = isLoading;
    spin.style.display = isLoading ? 'inline-block' : 'none';
    btnText.textContent = isLoading ? 'Bezig…' : 'Inloggen';
    btn.style.opacity = isLoading ? '0.85' : '1';
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    hide(msgErr); hide(msgOk);

    const u = (username.value || '').trim();
    const p = (password.value || '').trim();

    if (!u || !p) {
      msgErr.textContent = "Vul je gebruikersnaam en wachtwoord in.";
      show(msgErr);
      return;
    }

    setLoading(true);

    setTimeout(() => {
      const ok = USERS[u] && USERS[u] === p;

      if (!ok) {
        setLoading(false);
        msgErr.textContent = "Onjuiste gegevens. Probeer opnieuw.";
        show(msgErr);
        return;
      }

      if (remember.checked) localStorage.setItem('ymaanygo_driver_user', u);
      else localStorage.removeItem('ymaanygo_driver_user');

      localStorage.setItem('ymaanygo_driver_session', u);

      show(msgOk);

      window.location.href = "/chauffeur-dashboard.html";
    }, 650);
  });
</script>

</body>
</html>
