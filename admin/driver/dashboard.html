<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ymaanyGO Driver</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --purple:#5f249f;
  --purple2:#6f2dbd;
  --green:#1f9d55;
  --text:#30343b;
  --muted:#8b939c;
  --line:#edf0f2;
  --bg:#fff;
  --soft:#f5f5f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff;
  color:var(--text);
  min-height:100vh;
  padding-bottom:74px;
}
.page{display:none;min-height:100vh}
.page.active{display:block}
.top{
  height:88px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.top h1{font-size:22px;font-weight:750}
.icon-btn{
  position:absolute;
  width:52px;height:52px;border:0;border-radius:50%;
  background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.08);
  display:grid;place-items:center;color:var(--text)
}
.left{left:22px}
.right{right:22px}
.clock{
  position:absolute;right:22px;
  padding:13px 22px;border-radius:24px;background:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.07);
  font-weight:800;font-size:18px;
}
.content{padding:22px 24px}
.route-date{font-size:18px;margin-bottom:18px}
.route-line{display:grid;grid-template-columns:48px 1fr 34px;gap:0;align-items:start}
.time{font-size:20px;line-height:1.1}
.path{display:flex;flex-direction:column;align-items:center}
.dot{width:18px;height:18px;border-radius:50%;border:6px solid var(--purple)}
.vline{width:4px;height:64px;background:#c6b0dc}
.pin{width:24px;height:24px;color:var(--purple)}
.addr{padding-left:8px;padding-bottom:22px}
.addr b{display:block;font-size:18px;line-height:1.15}
.addr span{display:block;font-size:17px;color:#4b4f56;margin-top:6px}
.navico{color:#555;margin-top:8px}
.hr{height:1px;background:var(--line);margin:8px 0 20px}
.section-title{font-size:20px;font-weight:800;margin-bottom:14px}
.detail{display:flex;gap:14px;align-items:flex-start;margin:13px 0;color:#3f444b;font-size:18px;line-height:1.45}
.detail svg{flex:0 0 24px;color:#555;margin-top:2px}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.tag{
  padding:10px 16px;border-radius:6px;color:#fff;font-size:16px;
  background:#64ad58
}
.tag.light{background:#9de027;color:#fff}
.price-bar{
  position:fixed;left:0;right:0;bottom:74px;background:#fafafa;
  border-top:1px solid var(--line);padding:16px 24px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:20px
}
.price-label{font-size:16px;color:#777}
.price-val{font-size:22px;font-weight:900;margin-top:4px}
.accept{
  background:var(--purple);color:#fff;border:0;border-radius:14px;
  padding:18px 28px;font-size:20px;font-weight:850;min-width:190px
}
.commission{
  position:fixed;left:0;right:0;bottom:18px;text-align:center;
  color:#8c9399;font-size:15px;line-height:1.55;pointer-events:none
}
.bottom{
  position:fixed;bottom:0;left:0;right:0;height:74px;background:#fff;
  border-top:1px solid var(--line);display:flex;z-index:20
}
.nav{
  flex:1;border:0;background:#fff;color:#a0a7ad;font-size:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px
}
.nav svg{width:25px;height:25px}
.nav.active{color:var(--purple)}
.calendar-head{padding:26px 24px 8px;background:#fff}
.month-title{font-size:20px;font-weight:800;margin-bottom:22px}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.week div{color:#a9b0b6;font-size:16px;margin-bottom:16px}
.day{
  height:54px;display:flex;align-items:center;justify-content:center;
  font-size:20px;border-radius:50%;position:relative;margin:auto;width:54px
}
.day.active{background:var(--purple);color:#fff}
.day.today{background:#eef0f2}
.day.has::after{
  content:"";position:absolute;bottom:5px;width:7px;height:7px;border-radius:50%;
  background:var(--purple)
}
.agenda-body{background:#f2f2f2;min-height:calc(100vh - 300px);padding:28px 24px}
.agenda-title{font-size:21px;font-weight:850;margin-bottom:18px}
.agenda-card{
  background:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px
}
.agenda-status{color:var(--green);font-weight:850;font-size:18px}
.agenda-price{
  float:right;background:#eef0f3;border-radius:8px;padding:8px 14px;
  font-weight:850;font-size:17px
}
.agenda-route{font-size:20px;margin-top:22px}
.agenda-sub{font-size:17px;color:#757b82;margin-top:5px}
.agenda-time{font-size:19px;margin-top:22px}
.empty{text-align:center;color:#8b939c;padding:80px 20px;font-size:18px}
.account{padding:24px}
.account-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.row{padding:14px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:#8b939c;font-size:13px;margin-bottom:5px}
.row div{font-size:17px;font-weight:700}
.logout{
  margin-top:18px;width:100%;border:0;background:#c62828;color:#fff;
  padding:15px;border-radius:14px;font-weight:850;font-size:16px
}
.confirm{
  position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;
  align-items:center;justify-content:center;z-index:50;padding:24px
}
.confirm.open{display:flex}
.dialog{
  width:100%;max-width:330px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(18px);border-radius:28px;padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.18)
}
.dialog h3{font-size:21px;margin-bottom:12px}
.dialog p{font-size:17px;color:#666;line-height:1.45}
.dialog-actions{display:flex;gap:12px;margin-top:22px}
.dialog-actions button{
  flex:1;border:0;border-radius:22px;padding:14px;font-size:18px;font-weight:800;
  background:#e3e3e3
}
@media(max-width:390px){
  .content{padding:18px}
  .accept{min-width:155px}
  .price-bar{padding-left:18px;padding-right:18px}
}
</style>
</head>

<body>

<section id="pageRitten" class="page active">
  <div class="top">
    <button class="icon-btn left" onclick="loadRides()">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>Ritten</h1>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div id="ridesView"></div>
</section>

<section id="pageAgenda" class="page">
  <div class="calendar-head">
    <div class="month-title" id="monthTitle">Mei 2026</div>
    <div class="week"><div>Ma</div><div>Di</div><div>Wo</div><div>Do</div><div>Vr</div><div>Za</div><div>Zo</div></div>
    <div class="days" id="calendarDays"></div>
  </div>
  <div class="agenda-body">
    <div class="agenda-title" id="agendaDateTitle">Vandaag</div>
    <div id="agendaList"></div>
  </div>
</section>

<section id="pageAccount" class="page">
  <div class="top"><h1>Account</h1></div>
  <div class="account">
    <div class="account-card">
      <div class="row"><small>Naam</small><div id="accName">-</div></div>
      <div class="row"><small>E-mail</small><div id="accEmail">-</div></div>
      <div class="row"><small>Telefoon</small><div id="accPhone">-</div></div>
      <div class="row"><small>Status</small><div id="accRole">driver</div></div>
      <button class="logout" onclick="logout()">Uitloggen</button>
    </div>
  </div>
</section>

<nav class="bottom">
  <button id="navRitten" class="nav active" onclick="showPage('ritten')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17h10l2-6H5l2 6z"/><path d="M6 17v2M18 17v2M8 11l1-4h6l1 4"/></svg>
    Ritten
  </button>
  <button id="navAgenda" class="nav" onclick="showPage('agenda')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Agenda
  </button>
  <button id="navAccount" class="nav" onclick="showPage('account')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
    Account
  </button>
</nav>

<div id="confirmBox" class="confirm">
  <div class="dialog">
    <h3>Weet je het zeker?</h3>
    <p>Weet je zeker dat je deze rit wilt accepteren?</p>
    <div class="dialog-actions">
      <button onclick="closeConfirm()">Nee</button>
      <button onclick="doAccept()">Ja</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lxbfobdczjgqnotwsnki.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_H5HKGlHBe9z3ejn0B-NKsw_9Mo-MIhp";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let user=null, profile={}, rides=[], selectedRide=null, selectedDate=new Date();

function price(v){return String(v||"€0")}
function cleanPhone(v){return String(v||"").replace(/\D/g,"")}
function dateKey(d){return d.toISOString().slice(0,10)}
function fmtTime(v){const d=new Date(v);return isNaN(d)?"--:--":d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})}
function fmtDateLong(v){const d=new Date(v);return d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}

function updateClock(){
  const d=new Date();
  clock.textContent=d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
}
setInterval(updateClock,1000);updateClock();

function showPage(p){
  pageRitten.classList.remove("active");pageAgenda.classList.remove("active");pageAccount.classList.remove("active");
  navRitten.classList.remove("active");navAgenda.classList.remove("active");navAccount.classList.remove("active");
  if(p==="ritten"){pageRitten.classList.add("active");navRitten.classList.add("active")}
  if(p==="agenda"){pageAgenda.classList.add("active");navAgenda.classList.add("active");renderAgenda()}
  if(p==="account"){pageAccount.classList.add("active");navAccount.classList.add("active")}
}

async function protect(){
  const {data:s}=await db.auth.getSession();
  if(!s.session){location.href="/driver/login.html";return false}
  user=s.session.user;
  const {data:p}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
  profile=p||{};
  accName.textContent=profile.name||"-";
  accEmail.textContent=user.email||"-";
  accPhone.textContent=profile.phone||"-";
  accRole.textContent=profile.role||"driver";
  return true;
}

async function loadRides(){
  if(!await protect())return;
  const {data,error}=await db.from("rides").select("*")
    .or(`status.eq.pending,driver_id.eq.${user.id}`)
    .order("pickup_time",{ascending:true});
  if(error){ridesView.innerHTML=`<div class="empty">${error.message}</div>`;return}
  rides=data||[];
  renderRitten();
  renderAgenda();
}

function renderRitten(){
  const list=rides.filter(r=>r.status==="pending");
  if(!list.length){ridesView.innerHTML=`<div class="empty">Geen ritten beschikbaar</div>`;return}
  const r=list[0];
  ridesView.innerHTML=rideDetail(r,true);
}

function rideDetail(r,canAccept){
  const dt=new Date(r.pickup_time);
  const pickupTime=fmtTime(r.pickup_time);
  const endTime="--:--";
  return `
  <div class="content">
    <div class="route-date">${fmtDateLong(r.pickup_time)}</div>

    <div class="route-line">
      <div class="time">${pickupTime}</div>
      <div class="path"><div class="dot"></div><div class="vline"></div></div>
      <div class="navico">${navSvg()}</div>
      <div></div><div class="addr"><b>${r.from_address||"-"}</b><span>${cityFrom(r.from_address)}</span></div><div></div>
    </div>

    <div class="route-line">
      <div class="time">${endTime}</div>
      <div class="path">${pinSvg()}</div>
      <div class="navico">${navSvg()}</div>
      <div></div><div class="addr"><b>${r.to_address||"-"}</b><span>${cityFrom(r.to_address)}</span></div><div></div>
    </div>

    <div class="hr"></div>
    <div class="section-title">Details</div>
    <div class="detail">${routeSvg()}<div>${r.distance_km||"-"} km • ${r.duration_min||"-"} min</div></div>
    <div class="detail">${personSvg()}<div>${r.passengers||1} passagier${Number(r.passengers||1)>1?"s":""}</div></div>
    ${r.notes?`<div class="detail">${msgSvg()}<div>${r.notes}</div></div>`:""}

    <div class="tags">
      <div class="tag light">${r.vehicle||"Standaard taxi"}</div>
      <div class="tag">Standaard taxi</div>
    </div>
  </div>

  <div class="price-bar">
    <div>
      <div class="price-label">Prijs</div>
      <div class="price-val">${price(r.price)}</div>
    </div>
    ${canAccept?`<button class="accept" onclick="askAccept('${r.id}')">Accepteren</button>`:""}
  </div>
  <div class="commission">Bovenstaand bedrag maken wij aan je over.<br>Er gaat geen commissie meer af.</div>
  `;
}

function renderAgenda(){
  renderCalendar();
  const key=dateKey(selectedDate);
  const list=rides.filter(r=>r.driver_id===user.id && String(r.pickup_time||"").slice(0,10)===key);
  agendaDateTitle.textContent=fmtDateLong(selectedDate);
  if(!list.length){agendaList.innerHTML=`<div class="empty">Geen ritten gepland</div>`;return}
  agendaList.innerHTML=list.map(r=>`
    <div class="agenda-card">
      <div><span class="agenda-status">${statusText(r.status)}</span><span class="agenda-price">${price(r.price)}</span></div>
      <div class="agenda-route">${cityFrom(r.from_address)}</div>
      <div class="agenda-sub">Richting ${cityFrom(r.to_address)}</div>
      <div class="agenda-time">${fmtTime(r.pickup_time)}</div>
    </div>
  `).join("");
}

function renderCalendar(){
  const d=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
  monthTitle.textContent=d.toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
  const first=(d.getDay()+6)%7;
  const days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  let html="";
  for(let i=0;i<first;i++)html+="<div></div>";
  for(let day=1;day<=days;day++){
    const cur=new Date(d.getFullYear(),d.getMonth(),day);
    const key=dateKey(cur);
    const has=rides.some(r=>r.driver_id===user.id && String(r.pickup_time||"").slice(0,10)===key);
    const active=key===dateKey(selectedDate);
    const today=key===dateKey(new Date());
    html+=`<div class="day ${active?"active":""} ${today&&!active?"today":""} ${has?"has":""}" onclick="selectedDate=new Date(${cur.getTime()});renderAgenda()">${day}</div>`;
  }
  calendarDays.innerHTML=html;
}

function askAccept(id){selectedRide=rides.find(r=>r.id===id);confirmBox.classList.add("open")}
function closeConfirm(){confirmBox.classList.remove("open")}
async function doAccept(){
  if(!selectedRide)return;
  const {error}=await db.from("rides").update({
    driver_id:user.id,
    driver_name:profile.name||user.email,
    driver_phone:profile.phone||"",
    status:"accepted",
    accepted_at:new Date().toISOString()
  }).eq("id",selectedRide.id).eq("status","pending");
  if(error){alert(error.message);return}
  closeConfirm();await loadRides();showPage("agenda");
}
async function logout(){await db.auth.signOut();location.href="/driver/login.html"}

function cityFrom(v){return String(v||"").split(",").slice(-2,-1)[0]?.trim()||String(v||"-").split(" ").slice(-1)[0]}
function statusText(s){if(s==="completed")return"Rit afgerond";if(s==="accepted")return"Geaccepteerd";return s||"Rit"}
function navSvg(){return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>`}
function pinSvg(){return `<svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.2"/></svg>`}
function routeSvg(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 19c3 0 3-4 6-4s3-4 6-4"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="11" r="2"/></svg>`}
function personSvg(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>`}
function msgSvg(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-9 8.5 9 9 0 0 1-4-.9L3 20l1.2-4A8.5 8.5 0 1 1 21 11.5z"/></svg>`}

loadRides();
setInterval(loadRides,12000);
</script>

</body>
</html>
