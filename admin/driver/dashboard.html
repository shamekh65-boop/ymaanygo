<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ymaanyGO Driver – Ritten</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --primary: #4a154b; /* بنفسجي أنيق ومريح */
    --primary-light: #f5eff6;
    --text-main: #1e1e24;
    --text-sub: #757580;
    --bg-main: #ffffff;
    --border-color: #f0f0f5;
    --success: #10b981;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    padding-bottom: 80px;
    -webkit-font-smoothing: antialiased;
  }

  /* الشريط العلوي الناعم */
  .topbar {
    background: var(--bg-main);
    color: var(--text-main);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border-color);
  }
  
  .logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  
  .logo span { color: var(--primary); }
  
  .online {
    background: #e6f7ed;
    color: var(--success);
    border-radius: 99px;
    padding: 5px 12px;
    font-weight: 600;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  
  .online::before {
    content: "";
    width: 6px;
    height: 6px;
    background: var(--success);
    border-radius: 50%;
  }

  .wrap { padding: 16px; }

  /* العناوين الفرعية */
  .sub {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  
  .sub h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
  }
  
  .count {
    background: var(--primary-light);
    color: var(--primary);
    border-radius: 6px;
    padding: 2px 8px;
    font-weight: 700;
    font-size: 11px;
  }

  /* كروت الرحلات المرتبة وبدون زحمة */
  .card {
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  
  .card-head {
    background: #fafafa;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .date {
    font-weight: 700;
    color: var(--text-main);
    font-size: 12px;
  }
  
  .id {
    font-family: monospace;
    color: var(--text-sub);
    font-size: 11px;
  }

  /* خط السير */
  .route { padding: 14px; }
  
  .point {
    position: relative;
    padding-left: 18px;
    margin-bottom: 12px;
  }
  
  .point::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 5px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-sub);
  }
  
  .point.pickup::before { background: var(--primary); }
  
  .label {
    font-size: 10px;
    color: var(--text-sub);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .addr {
    font-size: 13px;
    font-weight: 600;
    margin-top: 1px;
    color: var(--text-main);
  }

  /* الرقاقات الحجم الصغير الخفيف */
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 14px 12px;
  }
  
  .chip {
    background: #f8f8fa;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--text-sub);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .chip svg {
    width: 12px;
    height: 12px;
    fill: var(--text-sub);
  }

  /* تذييل الكرت المالي زر متناسق */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-top: 1px solid var(--border-color);
    background: #fafafa;
  }
  
  .price {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-main);
  }
  
  .note {
    font-size: 10px;
    color: var(--text-sub);
    margin-top: 2px;
  }

  /* الأزرار العصرية النظيفة */
  .btn {
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  
  .btn.dark { background: var(--primary); color: white; }
  .btn.green { background: var(--success); color: white; }
  .btn.red { background: var(--danger); color: white; }
  .btn.gray { background: #f0f0f5; color: var(--text-main); border-color: #e2e2e9; }
  
  .actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .empty {
    text-align: center;
    color: var(--text-sub);
    padding: 80px 20px;
    font-size: 13px;
  }

  /* شريط التنقل السفلي المودرن الصافي */
  .tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: var(--bg-main);
    border-top: 1px solid var(--border-color);
    display: flex;
    z-index: 30;
  }
  
  .tab {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--text-sub);
    font-weight: 600;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
  }
  
  .tab svg {
    width: 20px;
    height: 20px;
    fill: var(--text-sub);
    transition: fill 0.2s;
  }
  
  .tab.active { color: var(--primary); }
  .tab.active svg { fill: var(--primary); }
  
  .hidden { display: none; }

  /* نوافذ التفاصيل المنبثقة الأسفل */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.2);
    backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    z-index: 50;
  }
  
  .overlay.open { display: flex; }
  
  .sheet {
    background: var(--bg-main);
    width: 100%;
    border-radius: 16px 16px 0 0;
    padding: 20px;
    max-height: 85vh;
    overflow: auto;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
  }
  
  .sheet h2 {
    margin: 0 0 16px;
    font-size: 16px;
    font-weight: 700;
  }
  
  .info {
    border-bottom: 1px solid var(--border-color);
    padding: 10px 0;
    font-size: 13px;
  }
  
  .info small {
    display: block;
    color: var(--text-sub);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .account-card {
    background: var(--bg-main);
    border-radius: 12px;
  }
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">ymaany<span>GO</span></div>
  <div class="online" id="onlineBadge">Online</div>
</div>

<div class="wrap">

  <section id="tabRitten">
    <div class="sub">
      <h2>Beschikbare Veilingen</h2>
      <span class="count" id="tripCount">0</span>
    </div>
    <div id="ridesList"></div>
  </section>

  <section id="tabAgenda" class="hidden">
    <div class="sub">
      <h2>Mijn Agenda</h2>
      <span class="count" id="agendaCount">0</span>
    </div>
    <div id="agendaList"></div>
  </section>

  <section id="tabAccount" class="hidden">
    <div class="account-card">
      <div class="info"><small>Naam</small><div id="accName">-</div></div>
      <div class="info"><small>E-mail</small><div id="accEmail">-</div></div>
      <div class="info"><small>Telefoon</small><div id="accPhone">-</div></div>
      <div class="info"><small>Status</small><div id="accRole">driver</div></div>
      <div style="margin-top: 20px;">
        <button class="btn red" onclick="logout()">Uitloggen</button>
      </div>
    </div>
  </section>

</div>

<nav class="tabs">
  <button id="navRitten" class="tab active" onclick="showTab('ritten')">
    <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
    Veiling
  </button>
  <button id="navAgenda" class="tab" onclick="showTab('agenda')">
    <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
    Agenda
  </button>
  <button id="navAccount" class="tab" onclick="showTab('account')">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    Account
  </button>
</nav>

<div id="overlay" class="overlay" onclick="closeSheet(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div id="sheetBody"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lxbfobdczjgqnotwsnki.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_H5HKGlHBe9z3ejn0B-NKsw_9Mo-MIhp";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let user = null;
let profile = null;
let rides = [];
let selectedRide = null;

function money(v){
  return "€ " + parseFloat(v || 0).toFixed(2);
}

function fmtDate(v){
  if(!v) return "-";
  const d = new Date(v);
  if(isNaN(d)) return "-";
  return d.toLocaleString("nl-NL",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

function showTab(tab){
  tabRitten.classList.add("hidden");
  tabAgenda.classList.add("hidden");
  tabAccount.classList.add("hidden");

  navRitten.classList.remove("active");
  navAgenda.classList.remove("active");
  navAccount.classList.remove("active");

  if(tab === "ritten"){
    tabRitten.classList.remove("hidden");
    navRitten.classList.add("active");
    renderRides();
  }
  if(tab === "agenda"){
    tabAgenda.classList.remove("hidden");
    navAgenda.classList.add("active");
    renderAgenda();
  }
  if(tab === "account"){
    tabAccount.classList.remove("hidden");
    navAccount.classList.add("active");
  }
}

async function protectDriver(){
  const { data:sessionData } = await db.auth.getSession();
  if(!sessionData.session){
    window.location.href = "/driver/login.html";
    return false;
  }
  user = sessionData.session.user;

  const { data:p } = await db
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  profile = p || {};
  accName.textContent = profile.name || "-";
  accEmail.textContent = user.email || "-";
  accPhone.textContent = profile.phone || "-";
  accRole.textContent = profile.role || "driver";
  return true;
}

async function loadRides(){
  const ok = await protectDriver();
  if(!ok) return;

  const { data,error } = await db
    .from("rides")
    .select("*")
    .or(`status.eq.pending,driver_id.eq.${user.id}`)
    .order("pickup_time",{ascending:true});

  if(error){
    ridesList.innerHTML = `<div class="empty">${error.message}</div>`;
    return;
  }

  rides = data || [];
  renderRides();
  renderAgenda();
}

function renderRides(){
  const list = rides.filter(r => r.status === "pending");
  tripCount.textContent = list.length;
  if(!list.length){
    ridesList.innerHTML = `<div class="empty">Geen ritten beschikbaar op dit moment.</div>`;
    return;
  }
  ridesList.innerHTML = list.map(rideCard).join("");
}

function renderAgenda(){
  const list = rides.filter(r => r.driver_id === user.id && !["completed","cancelled"].includes(r.status));
  agendaCount.textContent = list.length;
  if(!list.length){
    agendaList.innerHTML = `<div class="empty">Jouw agenda is leeg.</div>`;
    return;
  }
  agendaList.innerHTML = list.map(rideCard).join("");
}

function rideCard(r){
  const mine = r.driver_id === user.id;

  // هيكل SVGs النظيف للأيقونات الداخلية
  const userIcon = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>`;
  const carIcon = `<svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>`;

  return `
    <div class="card">
      <div class="card-head">
        <div class="date">${fmtDate(r.pickup_time)}</div>
        <div class="id">#${String(r.id).slice(0,8)}</div>
      </div>

      <div class="route">
        <div class="point pickup">
          <div class="label">Van</div>
          <div class="addr">${r.from_address || "-"}</div>
        </div>
        <div class="point">
          <div class="label">Naar</div>
          <div class="addr">${r.to_address || "-"}</div>
        </div>

        ${mine ? `
        <div class="actions">
          <button class="btn gray" onclick="quickStatus('${r.id}','on_the_way')">Onderweg</button>
          <button class="btn gray" onclick="quickStatus('${r.id}','arrived')">Aangekomen</button>
          <button class="btn green" onclick="quickStatus('${r.id}','completed')">Voltooien</button>
        </div>` : ""}
      </div>

      <div class="meta">
        <div class="chip">${carIcon} ${r.vehicle || "Standaard"}</div>
        <div class="chip">${userIcon} ${r.passengers || 1} Passagier</div>
        <div class="chip">📌 ${r.status || "Open"}</div>
      </div>

      <div class="footer">
        <div>
          <div class="price">${money(r.price)}</div>
          <div class="note">Exclusief commissie</div>
        </div>
        <button class="btn dark" onclick="openRide('${r.id}')">Bekijken</button>
      </div>
    </div>
  `;
}

function openRide(id){
  selectedRide = rides.find(r => r.id === id);
  if(!selectedRide) return;

  const r = selectedRide;
  const mine = r.driver_id === user.id;

  sheetBody.innerHTML = `
    <h2>Details van rit</h2>
    <div class="info"><small>Ophaallocatie</small><b>${r.from_address || "-"}</b></div>
    <div class="info"><small>Bestemming</small><b>${r.to_address || "-"}</b></div>
    <div class="info"><small>Tijdstip</small>${fmtDate(r.pickup_time)}</div>
    <div class="info"><small>Klant Info</small>${r.customer_name || "-"}<br>${r.customer_phone || "-"}</div>
    <div class="info"><small>Tarief</small><b>${money(r.price)}</b> (100% Chauffeur)</div>

    <div class="actions" style="margin-top:20px;">
      <a class="btn gray" target="_blank" href="https://maps.google.com/?q=${encodeURIComponent(r.from_address || "")}">Navigeer</a>
      ${r.customer_phone ? `<a class="btn gray" href="tel:${r.customer_phone}">Bellen</a>` : ""}
    </div>

    <div class="actions" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--border-color)">
      ${!mine && r.status === "pending" ? `<button class="btn dark" style="width:100%; justify-content:center;" onclick="acceptRide('${r.id}')">Accepteer Rit</button>` : ""}
      ${mine ? `
        <button class="btn gray" onclick="quickStatus('${r.id}','on_the_way')">Onderweg</button>
        <button class="btn gray" onclick="quickStatus('${r.id}','arrived')">Aangekomen</button>
        <button class="btn green" onclick="quickStatus('${r.id}','completed')">Rit Voltooien</button>
      ` : ""}
    </div>
  `;

  overlay.classList.add("open");
}

function closeSheet(e){
  if(!e || e.target === overlay){
    overlay.classList.remove("open");
  }
}

async function acceptRide(id){
  const payload = {
    driver_id: user.id,
    driver_name: profile.name || user.email,
    driver_phone: profile.phone || "",
    status: "accepted",
    accepted_at: new Date().toISOString()
  };

  const { error } = await db
    .from("rides")
    .update(payload)
    .eq("id", id)
    .eq("status", "pending");

  if(error){
    alert(error.message);
    return;
  }

  closeSheet();
  await loadRides();
  showTab("agenda");
}

async function quickStatus(id,status){
  const payload = { status };
  if(status === "completed"){
    payload.completed_at = new Date().toISOString();
  }

  const { error } = await db
    .from("rides")
    .update(payload)
    .eq("id", id)
    .eq("driver_id", user.id);

  if(error){
    alert(error.message);
    return;
  }

  closeSheet();
  await loadRides();
}

async function logout(){
  await db.auth.signOut();
  window.location.href = "/driver/login.html";
}

loadRides();
setInterval(loadRides,12000);
</script>

</body>
</html>
